name: Update earnings desk

# Every 3 hours, every day (the calendar and pre/after-market reports move outside US hours too).
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['earnings/**', '.github/workflows/earnings.yml']

permissions:
  contents: write

concurrency:
  group: earnings
  cancel-in-progress: false

jobs:
  earnings:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: earnings/requirements.txt

      - run: pip install -r earnings/requirements.txt

      - name: Restore the previous feed (kept for any ticker that fails this run)
        run: |
          mkdir -p out
          if git fetch --depth=1 origin earnings-data 2>/dev/null; then
            git --work-tree=out checkout FETCH_HEAD -- . || true
            git reset -q
          fi

      - run: python earnings/earnings.py --out out

      - name: Publish to the earnings-data branch (single commit, force-pushed)
        working-directory: out
        run: |
          rm -rf .git
          git init -q -b earnings-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar.json t
          git commit -q -m "earnings $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" earnings-data
