<style>
:root{
  --bg:#f7f5ef; --surface:#fffdf8; --cell:#f1eee5; --ink:#171a2b; --ink-2:#474b63; --ink-3:#74788f; --line:#e4dfd2;
  --accent:#2b44b0; --accent-soft:rgba(43,68,176,.09); --up:#18794e; --up-soft:rgba(24,121,78,.12); --down:#c8372d; --down-soft:rgba(200,55,45,.11);
  --f-display:"Fraunces","Noto Serif KR",Georgia,serif;
  --f-body:"Inter",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12141c; --surface:#1a1d28; --cell:#222634; --ink:#eceef6; --ink-2:#b9bdd0; --ink-3:#8b90a8; --line:#2c3142;
  --accent:#93a7ff; --accent-soft:rgba(147,167,255,.13); --up:#4cc38a; --up-soft:rgba(76,195,138,.15); --down:#ff7b72; --down-soft:rgba(255,123,114,.14);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#12141c; --surface:#1a1d28; --cell:#222634; --ink:#eceef6; --ink-2:#b9bdd0; --ink-3:#8b90a8; --line:#2c3142;
  --accent:#93a7ff; --accent-soft:rgba(147,167,255,.13); --up:#4cc38a; --up-soft:rgba(76,195,138,.15); --down:#ff7b72; --down-soft:rgba(255,123,114,.14);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 clamp(16px,4vw,40px)}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0}
.back{font-size:14px;font-weight:500;color:var(--ink-2);text-decoration:none}
.back:hover{color:var(--accent)}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--cell);border:1px solid var(--line)}
.seg button{border:0;background:none;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:500;color:var(--ink-3);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.hero{padding:28px 0 26px}
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--accent);letter-spacing:.02em;text-transform:uppercase}
.dot{width:8px;height:8px;border-radius:50%;background:var(--up);flex:none}
.dot.off{background:var(--ink-3)}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(36px,6vw,60px);line-height:1.05;letter-spacing:-.02em;margin:10px 0 12px}
.lede{font-size:clamp(16px,1.6vw,18px);color:var(--ink-2);max-width:62ch;margin:0}
.status{font-size:13px;color:var(--ink-3);margin-top:14px}

.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px}
.tile{appearance:none;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:16px 18px;cursor:pointer;min-width:0;transition:border-color .15s,background .15s}
.tile:hover{border-color:var(--c)}
.tile.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 8%,var(--surface))}
.tile .l{font-size:13px;font-weight:600;color:var(--ink-2)}
.tile .v{font-family:var(--f-display);font-size:44px;font-weight:600;line-height:1.05;color:var(--c);margin-top:2px}
.tile .v small{font-family:var(--f-body);font-size:14px;font-weight:500;color:var(--ink-3);margin-left:6px}
.tile .s{font-size:12.5px;color:var(--ink-3);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.buy{--c:var(--up)}.sell{--c:var(--down)}.mix{--c:var(--ink-2)}

.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.hint{font-size:13px;color:var(--ink-3)}
.find{width:190px;max-width:100%;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;outline:none}
.find:focus{border-color:var(--accent)}

.sheet{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(150px,1.5fr) repeat(5,minmax(0,1fr)) 104px;gap:8px;align-items:center;padding:11px 18px;border-top:1px solid var(--line)}
.row.head{border-top:0;font-size:12px;font-weight:600;color:var(--ink-3);background:var(--cell)}
.row.head div:not(:first-child){text-align:center}
.row.item{cursor:pointer;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.row.item:hover{background:var(--accent-soft)}
.stock{min-width:0}
.stock .sym{font-weight:700;font-size:15px}
.stock .px{font-size:12.5px;margin-left:6px;color:var(--ink-2)}
.stock .nm{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:block;text-align:center;font-size:13px;font-weight:600;padding:5px 0;border-radius:999px;background:var(--cell);color:var(--ink-3)}
.chip.b{background:var(--up-soft);color:var(--up)}
.chip.s{background:var(--down-soft);color:var(--down)}
.chip.p{background:none;border:1px dashed var(--line);font-weight:500}
.cons{text-align:center;font-weight:700;font-size:13px;color:var(--c)}
.cons small{display:block;font-weight:500;font-size:11.5px;color:var(--ink-3)}
.detail{padding:8px 18px 20px;border-top:1px dashed var(--line);background:var(--cell)}
.people{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:10px}
.who{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:14px;padding:14px;min-width:0}
.who.b{--c:var(--up)}.who.s{--c:var(--down)}.who.h,.who.p{--c:var(--line)}
.who .n{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.who .n b{font-family:var(--f-display);font-size:19px;font-weight:600;line-height:1.1}
.who .n .chip{padding:3px 10px;flex:none}
.who .motto{font-size:11.5px;color:var(--ink-3);margin-top:4px;line-height:1.35}
.who .line{font-size:13.5px;font-weight:600;margin-top:10px;line-height:1.4}
.who ul{list-style:none;padding:0;margin:8px 0 0;font-size:12.5px;color:var(--ink-2)}
.who li{display:flex;gap:6px;padding:3px 0;line-height:1.35}
.who li i{font-style:normal;font-weight:700;flex:none;width:12px;text-align:center;color:var(--ink-3)}
.who li.pl i{color:var(--up)}.who li.mi i{color:var(--down)}
.metrics{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:12px;font-size:12px;color:var(--ink-3)}
.metrics span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.metrics b{color:var(--ink);font-weight:600}
.empty{padding:44px 16px;text-align:center;color:var(--ink-3)}

.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:28px}
.how div{border:1px solid var(--line);border-radius:18px;padding:18px;background:var(--surface)}
.how h3{font-family:var(--f-display);font-size:19px;font-weight:600;margin:0 0 6px}
.how p{margin:0;font-size:13.5px;color:var(--ink-2)}
.foot{font-size:12.5px;color:var(--ink-3);margin:22px 0 48px;line-height:1.6}
.foot a{color:var(--ink-2);font-weight:500}
.short{display:none}
@media (max-width:1000px){.people{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
  .row{grid-template-columns:minmax(64px,1.1fr) repeat(5,minmax(0,1fr));gap:4px;padding:10px 10px}
  .row>.cons,.row.head>div:last-child{display:none}
  .stock .nm,.stock .px{display:none}
  .chip{font-size:12px}.row .long{display:none}.row .short{display:inline}
  .row.head{font-size:11px}
  .people,.how{grid-template-columns:1fr}
  .tile{padding:12px 12px}.tile .v{font-size:32px}.tile .v small{display:none}
  .find{width:100%}
}
</style>
</head>

    if (!D) { $("sheet").innerHTML = '<div class="empty">' + t("loading") + "</div>"; return; }
    var rows = D.rows.slice().sort(function (a, b) { return RANK[a.cons] - RANK[b.cons] || (b.buys - b.sells) - (a.buys - a.sells) || a.sym.localeCompare(b.sym); });
    var when = new Date(D.updated * 1000).toLocaleString(lang === "ko" ? "ko-KR" : "en-GB", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
    $("dot").className = "dot" + (sample ? " off" : "");
    $("status").textContent = fill(t(sample ? "sample" : "asof"), { t: when, n: rows.length });
    $("tiles").innerHTML = Object.keys(CONS).map(function (k) {
      var c = CONS[k], g = rows.filter(function (r) { return r.cons === k; });
      return '<button type="button" class="tile ' + c[0] + (filter === k ? " on" : "") + '" data-f="' + k + '" aria-pressed="' + (filter === k) + '">' +
        '<div class="l">' + t(c[1]) + '</div><div class="v num">' + g.length + "<small>" + t("stocks") + "</small></div>" +
        '<div class="s">' + (g.slice(0, 6).map(function (r) { return esc(r.sym); }).join(" · ") || t(c[2])) + "</div></button>";
    }).join("");
    $("hint").textContent = D.spy_up === false ? t("weak") : filter ? fill(t("hintF"), { f: t(CONS[filter][1]) }) : t("hintAll");
    var show = rows.filter(function (r) { return (!filter || r.cons === filter) && (!query || r.sym.indexOf(query) === 0 || String(r.name).toUpperCase().indexOf(query) >= 0); });
    var en = lang === "en";
    $("sheet").innerHTML = '<div class="row head"><div>' + t("stock") + "</div>" + D.legends.map(function (L) { return "<div>" + esc(en ? L.name_en : L.name) + "</div>"; }).join("") + "<div>" + t("consensus") + "</div></div>" +
      (show.length ? show.map(function (r) {
        var c = CONS[r.cons];
        return '<button type="button" class="row item" data-sym="' + esc(r.sym) + '" aria-expanded="' + (open === r.sym) + '">' +
          '<div class="stock"><span class="sym">' + esc(r.sym) + '</span><span class="px num">' + money(r.price) + (r.chg != null ? ' <span class="' + (r.chg >= 0 ? "up" : "down") + '">' + sg(r.chg) + "</span>" : "") + "</span>" +
          '<div class="nm">' + esc(r.name) + "</div></div>" + D.legends.map(function (L) { return "<div>" + chip(r.v[L.key].v) + "</div>"; }).join("") +
          '<div class="cons ' + c[0] + '">' + t(c[1]) + '<small class="num">' + fill(t("tally"), { b: r.buys, s: r.sells }) + "</small></div></button>" +
          (open === r.sym ? detail(r) : "");
      }).join("") : '<div class="empty">' + t("none") + "</div>");
  }

  function setLang(l) { lang = l; try { localStorage.setItem("site-lang", l); localStorage.setItem("earn-lang", l); } catch (e) {} render(); }
  $("lang-en").onclick = function () { setLang("en"); };
  $("lang-ko").onclick = function () { setLang("ko"); };
  $("tiles").onclick = function (e) { var b = e.target.closest("[data-f]"); if (!b) return; filter = filter === b.getAttribute("data-f") ? "" : b.getAttribute("data-f"); render(); };
  $("sheet").onclick = function (e) { var r = e.target.closest(".row.item"); if (!r) return; var s = r.getAttribute("data-sym"); open = open === s ? "" : s; render(); };
  $("find").oninput = function () { query = this.value.trim().toUpperCase(); render(); };

  var ok = function (d) { return d && d.rows && d.rows.length && d.legends; };
  render();
  fetch(LIVE, { cache: "no-store" }).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (d) { if (!ok(d)) throw 0; D = d; render(); })
    .catch(function () {
      return fetch(SAMPLE).then(function (r) { return r.json(); }).then(function (d) { D = d; sample = true; render(); });
    }).catch(function () { $("sheet").innerHTML = '<div class="empty">' + t("none") + "</div>"; });
})();
</script>
</body>
</html>
