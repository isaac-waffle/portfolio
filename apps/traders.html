<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>가상 트레이더</title>
<style>
:root{
  --bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--sub:#6e6e73;--mute:#8e8e93;--line:rgba(0,0,0,.08);--soft:rgba(0,0,0,.04);
  --accent:#0071e3;--pill:#e8e8ed;--up:#1f8a4c;--down:#d03b3b;--warn:#b26b00;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
  --agg:#2a78d6;--bal:#eb6834;--def:#1baf7a;--swing:#eda100;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000;--card:#1c1c1e;--text:#f5f5f7;--sub:#98989d;--mute:#7c7c80;--line:rgba(255,255,255,.1);--soft:rgba(255,255,255,.05);
  --accent:#0a84ff;--pill:#2c2c2e;--up:#30d158;--down:#ff6961;--warn:#ffb340;--shadow:none;
  --agg:#3987e5;--bal:#d95926;--def:#199e70;--swing:#c98500;
}}
:root[data-theme="dark"]{
  --bg:#000;--card:#1c1c1e;--text:#f5f5f7;--sub:#98989d;--mute:#7c7c80;--line:rgba(255,255,255,.1);--soft:rgba(255,255,255,.05);
  --accent:#0a84ff;--pill:#2c2c2e;--up:#30d158;--down:#ff6961;--warn:#ffb340;--shadow:none;
  --agg:#3987e5;--bal:#d95926;--def:#199e70;--swing:#c98500;
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Helvetica Neue",sans-serif}
.wrap{max-width:1440px;margin:0 auto;padding:32px 28px 48px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h1{font:700 34px/1.05 -apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;letter-spacing:-.02em}
.date{color:var(--sub);margin-top:6px}
.tabs{display:inline-flex;background:var(--pill);border-radius:10px;padding:3px;gap:2px}
.tabs button{appearance:none;border:0;background:none;color:var(--text);font:500 14px/1 inherit;padding:8px 16px;border-radius:8px;cursor:pointer}
.tabs button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}.muted{color:var(--sub)}.warn{color:var(--warn)}

/* market strip */
.strip{display:grid;grid-template-columns:1.4fr repeat(4,1fr) 1.3fr;gap:10px;margin-bottom:16px}
.tile{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.tile .l{font-size:12px;color:var(--sub)}
.tile .v{font-size:20px;font-weight:650;letter-spacing:-.01em;margin-top:2px;white-space:nowrap}
.tile .s{font-size:12px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gauge{height:6px;border-radius:3px;background:var(--pill);margin-top:8px;position:relative;overflow:hidden}
.gauge i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--text)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mute);margin-right:6px;vertical-align:1px}
.dot.on{background:var(--up);box-shadow:0 0 0 3px color-mix(in srgb,var(--up) 25%,transparent);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px transparent}}
@media (max-width:1100px){.strip{grid-template-columns:repeat(3,1fr)}}
@media (max-width:560px){.strip{grid-template-columns:repeat(2,1fr)}.wrap{padding:20px 16px 40px}h1{font-size:28px}}

/* trader cards */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:1400px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:18px;border-top:4px solid var(--c);min-width:0}
.who{display:flex;align-items:center;gap:12px}
.av{width:44px;height:44px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.who .n{font-size:17px;font-weight:650}.who .n span{font-size:13px;color:var(--sub);font-weight:500;margin-left:4px}
.who .m{font-size:12px;color:var(--sub);line-height:1.35;margin-top:1px}
.badge{margin-left:auto;flex:none;font-size:12px;font-weight:600;padding:4px 10px;border-radius:980px;background:var(--pill);color:var(--sub)}
.badge.보유{background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.badge.탐색{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.eqrow{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:16px}
.eq .big{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1}
.eq .sub{font-size:13px;margin-top:6px}
.spark{width:150px;height:46px;flex:none;overflow:visible}
.bubble{position:relative;margin-top:16px;background:var(--soft);border-radius:14px;padding:12px 14px 12px 14px;font-size:14.5px;line-height:1.55}
.bubble .h{font-size:11px;font-weight:600;color:var(--sub);letter-spacing:.02em;margin-bottom:4px;display:flex;gap:6px;align-items:center}
.bubble .h .think{width:6px;height:6px;border-radius:50%;background:var(--c);animation:pulse2 1.6s infinite}
@keyframes pulse2{50%{opacity:.25}}
h3{font-size:12px;font-weight:600;color:var(--sub);margin:18px 0 8px;letter-spacing:.01em}
.pos{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.pos .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pos .sym{font-weight:650;font-size:15px}.pos .why{font-size:12px;color:var(--sub);margin-top:2px}
.track{position:relative;height:30px;margin:10px 4px 0}
.track .ln{position:absolute;left:0;right:0;top:9px;height:4px;border-radius:2px;background:var(--pill)}
.track .tk{position:absolute;top:5px;width:2px;height:12px;border-radius:1px;transform:translateX(-1px)}
.track .lb{position:absolute;top:19px;font-size:11px;color:var(--sub);white-space:nowrap}
.track .me{position:absolute;top:4px;width:14px;height:14px;border-radius:50%;background:var(--c);border:2px solid var(--card);transform:translateX(-7px);box-shadow:0 0 0 1px var(--c)}
.empty{font-size:13px;color:var(--mute);padding:4px 0}
.wl{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.wl:first-child{border-top:0}
.wl .s{font-weight:600;width:52px;flex:none}
.wl .sc{width:30px;text-align:right;flex:none;color:var(--sub)}
.wl .r{flex:1;min-width:0;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wl .ic{width:18px;flex:none;text-align:center;font-weight:700}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.chip{font-size:12px;padding:3px 9px;border-radius:980px;background:var(--pill);color:var(--sub);white-space:nowrap}
.feed{max-height:420px;overflow:auto;margin:0 -6px;padding:0 6px}
.ev{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px;line-height:1.5}
.ev:first-child{border-top:0}
.ev .t{color:var(--mute);width:38px;flex:none}
.ev .k{flex:none;font-size:11px;font-weight:600;padding:1px 7px;border-radius:6px;height:fit-content;margin-top:1px;background:var(--pill);color:var(--sub)}
.ev .x{white-space:pre-wrap;min-width:0;overflow-wrap:anywhere}
.k.buy,.k.close.win{background:color-mix(in srgb,var(--up) 16%,transparent);color:var(--up)}
.k.sell{background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.k.close.loss{background:color-mix(in srgb,var(--down) 14%,transparent);color:var(--down)}
.k.plan,.k.review{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.k.decide{background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.ev.big .x{font-size:13.5px}
.lower{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-top:16px;align-items:start}
.nw{padding:9px 0;border-top:1px solid var(--line);font-size:13px;line-height:1.5}.nw:first-child{border-top:0}
.nw a{color:var(--text);text-decoration:none;font-weight:500}.nw a:hover{text-decoration:underline}
.nw .m{color:var(--mute);font-size:12px;margin-right:6px}
.imp{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:6px;margin:4px 4px 0 0}
.imp.p{background:color-mix(in srgb,var(--up) 15%,transparent);color:var(--up)}
.imp.n{background:color-mix(in srgb,var(--down) 14%,transparent);color:var(--down)}
.k.news{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
@media (max-width:900px){.lower{grid-template-columns:1fr}}
.panel{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px 18px;min-width:0}
.panel h2{font-size:15px;font-weight:650;margin-bottom:8px}
.err{background:color-mix(in srgb,var(--down) 12%,transparent);color:var(--down);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13px}

/* history */
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:1400px){.sum{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.sum{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.kv div{font-size:12px;color:var(--sub)}.kv b{display:block;font-size:17px;color:var(--text);font-weight:650}
.hint{font-size:13px;padding:7px 0;border-top:1px solid var(--line);line-height:1.5}
.hint:first-child{border-top:0}
.chart{position:relative}
.chart svg{width:100%;height:260px;display:block;overflow:visible}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);box-shadow:0 6px 24px rgba(0,0,0,.15);
  border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.5;display:none;z-index:5;white-space:nowrap}
.seg{display:inline-flex;background:var(--pill);border-radius:9px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{appearance:none;border:0;background:none;color:var(--text);font:500 13px/1 inherit;padding:6px 11px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.1);font-weight:600}
.tw{overflow:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-weight:600;color:var(--sub);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px}
td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.r,th.r{text-align:right}
tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
tr.det td{white-space:normal;color:var(--sub);background:var(--soft);font-size:12.5px;line-height:1.6}
.sw{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
select{font:inherit;font-size:13px;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.replay{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:12px}
@media (max-width:1400px){.replay{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.replay{grid-template-columns:1fr}}
.replay .feed{max-height:560px}
footer{color:var(--sub);font-size:12px;margin-top:26px;line-height:1.6}
/* ── 공책 테마 (색·종이는 notebook.css) — 손글씨는 큰 제목(화면 제목·트레이더 이름·패널 제목)만, 나머지는 읽기 쉬운 시스템 글꼴 ── */
h1{font-size:clamp(38px,7vw,52px);line-height:1.1}
.date{font-size:14px}
.tabs{background:transparent;border:2px solid var(--ink);border-radius:var(--sketch);padding:3px}
.tabs button{color:var(--sub)}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:none;border-radius:var(--sketch2)}
.tile,.panel{background:var(--card);border:2px solid var(--ink);border-radius:var(--sketch);box-shadow:var(--shadow)}
.tile:nth-child(even),.panel:nth-child(even){border-radius:var(--sketch2)}
.gauge{background:var(--soft);border:1.5px solid var(--ink);height:9px;border-radius:var(--sketch)}
.gauge i{background:var(--ink)}
.card{position:relative;background:var(--card);border:2px solid var(--ink);border-radius:var(--sketch);box-shadow:var(--shadow)}
.card:nth-child(even){border-radius:var(--sketch2)}
.card::before{content:"";position:absolute;top:-11px;left:50%;width:96px;height:22px;transform:translateX(-50%) rotate(-3deg);
  background:color-mix(in srgb,var(--c) 55%,transparent);opacity:.85;border-radius:2px}
.card:nth-child(even)::before{transform:translateX(-50%) rotate(2.5deg)}
.av{border:2px solid var(--ink);border-radius:52% 46% 50% 48%/48% 52% 46% 50%;font-family:var(--hand);font-size:24px}
.who .n{font-family:var(--hand);font-size:28px;font-weight:700;line-height:1}
.who .n span{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;font-size:13px;font-weight:500}
.badge{border:1.5px solid currentColor;background:transparent!important;border-radius:var(--sketch)}
.bubble{background:var(--card);border:2px dashed var(--ink);border-radius:var(--sketch2)}
.bubble .h{color:var(--ink)}
h3{color:var(--ink)}
.pos{border:1.5px dashed var(--line);border-radius:var(--sketch)}
.wl{border-top:1.5px dashed var(--line)}
.chip{background:transparent;border:1.5px solid var(--line);border-radius:var(--sketch)}
.ev,.nw,.hint{border-top:1.5px dashed var(--line)}
.panel h2{font-family:var(--hand);font-size:25px;color:var(--ink)}
.panel h2 .muted{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}
.seg{background:transparent;border:1.5px solid var(--ink);border-radius:var(--sketch)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:none}
th{color:var(--ink)}
td,th{border-bottom:1.5px dashed var(--line)}
.tip{border:1.5px solid var(--ink);border-radius:var(--sketch)}
select{border:1.5px solid var(--ink);border-radius:var(--sketch)}

/* ── 1초 규칙: 시장은 한 줄, 카드는 오늘 손익·한 줄 요약·보유만 보이게 ── */
#strip.strip{display:block;margin-bottom:0}
.mkt{display:flex;flex-wrap:wrap;gap:6px 26px;align-items:flex-end;background:var(--card);border:2px solid var(--ink);
  border-radius:var(--sketch);box-shadow:var(--shadow);padding:12px 18px;margin-bottom:22px}
.mi{display:flex;flex-direction:column;min-width:0}
.ml{font-size:12px;color:var(--sub);white-space:nowrap}
.mv{font-size:22px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.mv small{font-size:13px;font-weight:600}
.mv.small{font-size:15px;font-weight:600;color:var(--sub)}
.mi.upd{margin-left:auto}
.who .n{flex:1;min-width:0}
.pnlrow{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:14px}
.pnl{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1}
.eqbig{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1;color:var(--text)}
.pnl small{font-size:16px;font-weight:650}
.pnl.muted{color:var(--text)}
.acct{font-size:13.5px;color:var(--sub);margin-top:7px;font-weight:600}
.head{margin-top:14px;font-size:16px;font-weight:700;line-height:1.35;display:flex;gap:8px;align-items:baseline}
.head .hd{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none;transform:translateY(-1px)}
.poss{margin-top:10px}
.pr{padding:6px 0 2px}
.pr+.pr{border-top:1.5px dashed var(--line)}
.prt{display:flex;align-items:baseline;gap:4px;font-size:14px}
.prt b{font-size:15px}
.prv{margin-left:auto;font-weight:700;white-space:nowrap}
.prv small{font-weight:600;font-size:12px}
.pr .track{margin:4px 2px 0}
.foot2{font-size:12.5px;color:var(--sub);margin-top:10px}
details.more{margin-top:12px;border-top:1.5px dashed var(--line);padding-top:8px}
details.more>summary{cursor:pointer;font-size:13px;color:var(--ink);font-weight:600;list-style:none}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary:before{content:"▸ ";}
details.more[open]>summary:before{content:"▾ ";}
.motto{font-size:12.5px;color:var(--sub);margin-top:10px}
@media (max-width:760px){.mkt{gap:6px 18px}.mv{font-size:19px}.mi.upd{margin-left:0}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>가상 트레이더</h1><div class="date num" id="date">불러오는 중…</div></div>
    <div class="tabs"><button class="on" data-tab="live">실시간</button><button data-tab="hist">기록·개선</button></div>
  </header>

  <div id="live">
    <div id="err"></div>
    <div class="strip" id="strip"></div>
    <div class="grid" id="cards"></div>
    <div class="lower">
      <div class="panel"><div class="row"><h2>뉴스 <span class="muted" style="font-weight:400;font-size:13px">— 관심 종목에 영향 있는 것만 · 초록 호재 / 빨강 악재</span></h2>
        <span class="muted" id="newserr" style="font-size:12px"></span></div><div class="feed" id="news" style="max-height:520px"></div></div>
      <div>
        <div class="panel"><h2>스캐너가 새로 찾은 종목</h2><div id="disc" class="empty"></div></div>
        <div class="panel" style="margin-top:16px"><h2>시스템 기록</h2><div class="feed" id="sys" style="max-height:300px"></div></div>
      </div>
    </div>
  </div>

  <div id="hist" hidden>
    <div class="sum" id="hsum"></div>
    <div class="panel" style="margin-top:16px">
      <div class="row"><h2>누적 자산 <span class="muted" style="font-weight:400;font-size:13px">— 하루 마감 기준, 오늘은 진행 중 값</span></h2><div class="legend" id="leg"></div></div>
      <div class="chart" id="eqc"></div>
    </div>
    <div class="panel" style="margin-top:16px">
      <div class="row"><h2>무엇이 통했나</h2><div class="seg" id="gsel"></div></div>
      <div class="tw" id="gtab"></div>
    </div>
    <div class="panel" style="margin-top:16px">
      <div class="row"><h2>거래 기록 <span class="muted" style="font-weight:400;font-size:13px">— 줄을 누르면 진입·청산 이유</span></h2><div class="seg" id="tsel"></div></div>
      <div class="tw" id="ttab"></div>
    </div>
    <div class="panel" style="margin-top:16px">
      <div class="row"><h2>하루 다시 보기</h2><select id="dsel"></select></div>
      <div class="replay" id="rep"></div>
    </div>
  </div>

  <footer id="foot"></footer>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const usd = (x, d = 0) => (x < 0 ? '-' : '') + '$' + Math.abs(x).toLocaleString('en-US', {minimumFractionDigits:d, maximumFractionDigits:d});
const sgn = (x, d = 0) => (x >= 0 ? '+' : '-') + '$' + Math.abs(x).toLocaleString('en-US', {minimumFractionDigits:d, maximumFractionDigits:d});
const pct = (x, d = 2) => x == null ? '-' : (x >= 0 ? '+' : '') + (x * 100).toFixed(d) + '%';
const cls = x => x > 0 ? 'up' : x < 0 ? 'down' : 'muted';
const f2 = x => x == null ? '-' : x.toFixed(2);
const tAms = ts => new Date(ts).toLocaleTimeString('ko-KR', {timeZone:'Europe/Amsterdam', hour:'2-digit', minute:'2-digit', hour12:false});
const KIND = {think:'생각', pass:'패스', decide:'결정', buy:'매수', sell:'매도', close:'결과', plan:'계획', review:'회고', scan:'스캔', news:'뉴스'};
const TC = {agg:'var(--agg)', bal:'var(--bal)', def:'var(--def)', swing:'var(--swing)'};
let L = null, H = null, gkey = '셋업', tkey = 'all';
const OPEN = new Set();  // 펼친 '자세히' (5초마다 다시 그려도 유지)

document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  $('live').hidden = b.dataset.tab !== 'live'; $('hist').hidden = b.dataset.tab !== 'hist';
  if (b.dataset.tab === 'hist') loadHist();
});

function evRow(e, big){
  const k = e.kind === 'close' ? `close ${e.pnl > 0 ? 'win' : 'loss'}` : e.kind;
  return `<div class="ev${big ? ' big' : ''}"><span class="t num">${tAms(e.ts)}</span><span class="k ${k}">${KIND[e.kind] || e.kind}</span>` +
         `<span class="x">${esc(e.text)}</span></div>`;
}

function track(p){
  // 라벨은 왼쪽 손절, 오른쪽 다음 목표 두 개만 (가운데 눈금은 라벨 없이) — 겹치지 않게
  const lo = Math.min(p.stop, p.stop0, p.last), hi = Math.max(p.t2, p.last);
  const x = v => ((v - lo) / (hi - lo || 1) * 100).toFixed(1) + '%';
  const tick = (v, col) => `<span class="tk" style="left:${x(v)};background:${col}"></span>`;
  const goal = p.swing ? null : (p.half ? p.t2 : p.t1);
  const right = p.swing ? `최고 ${f2(p.t2)}` : `${p.half ? '2차' : '1차'} 목표 ${f2(goal)}`;
  return `<div class="track"><div class="ln"></div>` + tick(p.stop, 'var(--down)') + tick(p.entry, 'var(--mute)') +
    (p.half || p.swing ? '' : tick(p.t1, 'var(--up)')) + tick(p.t2, 'var(--up)') +
    `<span class="me" style="left:${x(p.last)}" title="현재 ${f2(p.last)}"></span>` +
    `<span class="lb num" style="left:0">${p.swing ? '스탑' : '손절'} ${f2(p.stop)}</span><span class="lb num" style="right:0;left:auto">${right}</span></div>`;
}

function spark(t){
  const c = t.curve || [];
  if (c.length < 2) return `<svg class="spark"></svg>`;
  const w = 150, h = 46, ys = c.map(p => p[1]).concat([t.start]);
  const lo = Math.min(...ys), hi = Math.max(...ys), sp = hi - lo || 1;
  const X = i => (i / (c.length - 1) * w).toFixed(1), Y = v => (h - 3 - (v - lo) / sp * (h - 6)).toFixed(1);
  const d = c.map((p, i) => (i ? 'L' : 'M') + X(i) + ' ' + Y(p[1])).join('');
  const last = c[c.length - 1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" data-k="${t.key}"><title>${last[0]} ET · ${usd(last[1])}</title>` +
    `<line x1="0" x2="${w}" y1="${Y(t.start)}" y2="${Y(t.start)}" stroke="var(--line)" stroke-dasharray="3 3"/>` +
    `<path d="${d}" fill="none" stroke="${TC[t.key]}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` +
    `<circle cx="${X(c.length - 1)}" cy="${Y(last[1])}" r="3.5" fill="${TC[t.key]}" stroke="var(--card)" stroke-width="2"/></svg>`;
}

function drawLive(){
  const now = new Date(L.now);
  $('date').textContent = now.toLocaleDateString('ko-KR', {timeZone:'Europe/Amsterdam', month:'long', day:'numeric', weekday:'long'}) +
    ' · 암스테르담 ' + tAms(L.now) + ' · 뉴욕 ' + now.toLocaleTimeString('ko-KR', {timeZone:'America/New_York', hour:'2-digit', minute:'2-digit', hour12:false});
  $('err').innerHTML = L.error ? `<div class="err">데이터 오류: ${esc(L.error)} — 다음 갱신 때 다시 시도해요.</div>` : '';
  const mk = L.mk, open = L.state === '정규장';
  const left = Math.max(0, (new Date(L.next_open) - Date.now()) / 60000);
  const item = (l, v, c = '') => `<div class="mi"><span class="ml">${l}</span><span class="mv num ${c}">${v}</span></div>`;
  const ix = s => item(s, L.idx[s] ? pct(L.idx[s].chg) : '-', L.idx[s] ? cls(L.idx[s].chg) : '');
  $('strip').innerHTML = `<div class="mkt">
      <div class="mi"><span class="ml"><span class="dot ${open ? 'on' : ''}"></span>${esc(L.state)}</span>
        <span class="mv">${open ? '장 진행 중' : `개장까지 ${Math.floor(left / 60)}시간 ${Math.round(left % 60)}분`}</span></div>` +
    item('시장 점수', `${mk.score ?? '-'} <small>${esc(mk.bias)}</small>`, mk.score >= 60 ? 'up' : mk.score <= 35 ? 'down' : '') +
    ix('SPY') + ix('QQQ') + ix('IWM') +
    item('VIX', mk.vix != null ? mk.vix.toFixed(1) : '-', mk.vix >= 25 ? 'down' : '') +
    `<div class="mi upd"><span class="ml">${open ? '갱신' : '개장'}</span><span class="mv small num">${open ? (L.last_fetch ? tAms(L.last_fetch) : '-') : esc(L.open_ams)}</span></div></div>`;
  const keep = [...document.querySelectorAll('#cards .feed')].map(f => f.scrollTop);
  $('cards').innerHTML = L.traders.map(t => {
    const dp = t.day_pnl / (t.start || 20000);
    const pos = t.pos.length ? t.pos.map(p => `<div class="pr" title="${esc(p.why)} · 진입 ${f2(p.entry)} → 현재 ${f2(p.last)}">
        <div class="prt"><b>${esc(p.sym)}</b><span class="muted"> ${p.shares}주 · ${p.swing ? p.days + '일째' : esc(p.setup)}</span>
        <span class="prv num ${cls(p.upl)}">${sgn(p.upl)} <small>${p.rot ? pct(p.last / p.entry - 1, 1) : (p.r >= 0 ? '+' : '') + p.r.toFixed(1) + 'R'}</small></span></div>${p.rot ? '' : track(p)}</div>`).join('')
      : `<div class="empty">보유 없음 · 현금 ${usd(t.cash)}</div>`;
    const wl = t.watch.length ? t.watch.map(w => `<div class="wl"><span class="ic ${w.ok ? 'up' : 'muted'}">${w.ok ? '✓' : '·'}</span>
        <span class="s">${esc(w.sym)}</span><span class="sc num">${Math.min(w.score, 100)}</span><span class="r" title="${esc(w.why)}">${esc(w.why)}</span></div>`).join('')
      : `<div class="empty">${open ? '지금 셋업이 감지된 종목 없음' : '장중에 채워져요'}</div>`;
    const lossLeft = t.start * t.daily_loss + Math.min(t.day_pnl, 0);
    const cnt = t.kind === 'swing' ? `보유 ${t.pos.length}/${t.max_trades}` : `거래 ${t.trades}/${t.max_trades}`;
    return `<div class="card" style="--c:${TC[t.key]}">
      <div class="who"><div class="av">${esc(t.nick[0])}</div><div class="n">${esc(t.nick)}<span>${esc(t.name)}</span></div>
        <span class="badge ${esc(t.status)}">${esc(t.status)}</span></div>
      <div class="pnlrow"><div><div class="eqbig num">${usd(t.equity)}</div>
        <div class="acct num"><span class="${cls(t.day_pnl)}">오늘 ${sgn(t.day_pnl)} (${pct(dp)})</span> · 누적 <span class="${cls(t.total_pnl)}">${pct(t.total_pnl / 20000)}</span></div></div>${spark(t)}</div>
      <div class="head"><span class="hd"></span>${esc(t.head || t.status)}</div>
      <div class="poss">${pos}</div>
      <div class="foot2 num">${cnt} · ${t.wins}승 ${t.losses}패${t.halted ? ` · <span class="warn">${esc(t.halted)}</span>` : ''}</div>
      <details class="more" data-k="${t.key}" ${OPEN.has(t.key) ? 'open' : ''}><summary>자세히 — 생각 전문 · ${t.mode === 'rotation' ? '모멘텀 순위' : t.kind === 'swing' ? '돌파 대기 종목' : '눈여겨보는 종목'} · 기록 ${t.feed.length}</summary>
        <div class="bubble"><div class="h">지금 생각</div>${esc(t.thought)}</div>
        <h3>${t.mode === 'rotation' ? '모멘텀 순위 <span class="muted" style="font-weight:400">(6개월 수익률 · 상위 5 편입, 매달 교체)</span>' : t.kind === 'swing' ? '돌파 신호 · 대기 종목 <span class="muted" style="font-weight:400">(장 마감 후 일봉)</span>' : '눈여겨보는 종목 <span class="muted" style="font-weight:400">(점수 · 판단)</span>'}</h3>${wl}
        <div class="meta">${t.mode === 'rotation' ? `<span class="chip">종목당 비중 ${Math.round(100 / t.max_trades)}%</span>` : `<span class="chip">거래당 위험 ${usd(t.start * t.risk)}</span>`}${t.daily_loss ? `<span class="chip">손실 한도까지 ${usd(Math.max(lossLeft, 0))}</span>` : '<span class="chip">오버나잇 보유</span>'}</div>
        <div class="m motto">${esc(t.motto)}</div>
        <h3>생각 기록</h3><div class="feed">${t.feed.length ? t.feed.map(e => evRow(e)).join('') : '<div class="empty">아직 기록 없음</div>'}</div>
      </details>
    </div>`;
  }).join('');
  document.querySelectorAll('#cards details.more').forEach(d => d.ontoggle = () => d.open ? OPEN.add(d.dataset.k) : OPEN.delete(d.dataset.k));
  document.querySelectorAll('#cards .feed').forEach((f, i) => f.scrollTop = keep[i] || 0);
  $('disc').innerHTML = L.disc.length ? L.disc.map(d => `<span class="chip" style="margin:0 6px 6px 0;display:inline-block" title="${esc(d.name)}">
      <b style="color:var(--text)">${esc(d.sym)}</b> ${d.src === 'news' ? '<span class="warn">뉴스</span>' : `<span class="${cls(d.chg)}">${pct(d.chg, 1)}</span>`}${d.rvol ? ` · 거래량 ${d.rvol.toFixed(1)}배` : ''}</span>`).join('')
    : '아직 없음 — 09:00 ET (15:00 암스테르담 전후)부터 30분마다 급등·거래 상위 종목을 찾아요.';
  $('newserr').textContent = L.news_err || '';
  const nk = $('news').scrollTop;
  $('news').innerHTML = (L.news || []).length ? L.news.map(n => `<div class="nw"><span class="m num">${tAms(n.t)}</span>` +
      (n.themes.length ? `<span class="chip" style="font-size:11px;padding:1px 7px">${esc(n.themes[0])}</span> ` : '') +
      `<a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.head)}</a><div>` +
      n.imp.map(([s, v]) => `<span class="imp ${v > 0 ? 'p' : 'n'}">${esc(s)} ${v > 0 ? '+' : ''}${v.toFixed(1)}</span>`).join('') + '</div></div>').join('')
    : '<div class="empty">관심 종목에 영향 있는 뉴스가 아직 없어요.</div>';
  $('news').scrollTop = nk;
  $('sys').innerHTML = L.system.length ? L.system.map(e => evRow(e)).join('') : '<div class="empty">아직 기록 없음</div>';
  $('foot').innerHTML = `규칙 ${esc(L.rules)} · 시작 자금 각 ${usd(L.start_cash)} · 네 명 모두 일봉 스윙 (v6부터 — 아이작 모멘텀 · 티모 돌파 8종목 · 차차 돌파+시장 필터 · 돌쇠 돌파), 장 마감 후 신호 → 다음 날 시가 매매, 오버나잇 보유 · 수수료 매수·매도 각 $2, 슬리피지 0.05% 반영 · 데이터 Yahoo Finance 1분봉` +
    (L.fetch_sec ? ` (수집 ${L.fetch_sec.toFixed(1)}초)` : '') + `<br>기록 위치: apps/journal/traders/ — trades.csv(거래·근거), days.csv(일별 결과), events/(모든 생각). 이 화면을 닫아도 프로그램이 켜져 있으면 계속 매매해요.`;
}

async function loadLive(){
  try { L = await (await fetch('/api/live')).json(); if (L.traders) drawLive(); }
  catch(e){ $('err').innerHTML = '<div class="err">트레이더 프로그램에 연결할 수 없어요 — 허브에서 다시 켜 주세요.</div>'; }
}

async function loadHist(){
  H = await (await fetch('/api/history')).json();
  drawHist();
  const ds = $('dsel'), cur = ds.value;
  ds.innerHTML = H.dates.map(d => `<option>${d}</option>`).join('') || '<option value="">기록 없음</option>';
  if (cur && H.dates.includes(cur)) ds.value = cur;
  loadDay();
}

function drawHist(){
  const T = H.traders, keys = Object.keys(T);
  $('hsum').innerHTML = keys.map(k => {
    const t = T[k], s = t.stats, eq = t.equity;
    return `<div class="card" style="--c:${TC[k]}"><div class="who"><div class="av">${esc(t.nick[0])}</div>
      <div><div class="n">${esc(t.nick)}<span>${esc(t.name)}</span></div><div class="m">${t.days}일 기록</div></div></div>
      <div class="kv num"><div>누적 손익<b class="${cls(eq - 20000)}">${sgn(eq - 20000)}</b></div><div>수익률<b class="${cls(eq - 20000)}">${pct(eq / 20000 - 1)}</b></div>
        <div>최대 낙폭<b>${pct(t.mdd)}</b></div><div>거래<b>${s.n}</b></div><div>승률<b>${s.n ? (s.win * 100).toFixed(0) + '%' : '-'}</b></div>
        <div>평균 R<b class="${s.n ? cls(s.avg_r) : ''}">${s.n ? (s.avg_r >= 0 ? '+' : '') + s.avg_r.toFixed(2) : '-'}</b></div></div>
      <h3>개선 힌트</h3>${t.hints.map(h => `<div class="hint">${esc(h)}</div>`).join('')}</div>`;
  }).join('');
  drawEq();
  const G = ['셋업', '종목 출처', '시간대', '청산 이유', '규칙 버전'];
  $('gsel').innerHTML = G.map(g => `<button class="${g === gkey ? 'on' : ''}" data-g="${g}">${g}</button>`).join('');
  $('gsel').querySelectorAll('button').forEach(b => b.onclick = () => { gkey = b.dataset.g; drawHist(); });
  const rows = keys.flatMap(k => (T[k].groups[gkey] || []).map(g => ({k, ...g})));
  $('gtab').innerHTML = rows.length ? `<table class="num"><tr><th>트레이더</th><th>${gkey}</th><th class="r">거래</th><th class="r">승률</th>
      <th class="r">평균 R</th><th class="r">손익</th><th class="r">손익비(PF)</th><th class="r">평균 보유</th></tr>` +
      rows.map(r => `<tr><td><span class="sw" style="background:${TC[r.k]}"></span>${esc(T[r.k].nick)}</td><td>${esc(r.key)}</td><td class="r">${r.n}</td>
        <td class="r">${(r.win * 100).toFixed(0)}%</td><td class="r ${cls(r.avg_r)}">${r.avg_r >= 0 ? '+' : ''}${r.avg_r.toFixed(2)}</td>
        <td class="r ${cls(r.pnl)}">${sgn(r.pnl)}</td><td class="r">${r.pf == null ? '-' : r.pf.toFixed(2)}</td><td class="r">${Math.round(r.hold)}분</td></tr>`).join('') + '</table>'
    : '<div class="empty">아직 청산된 거래가 없어요.</div>';
  $('tsel').innerHTML = [['all', '전체'], ...keys.map(k => [k, T[k].nick])].map(([k, n]) => `<button class="${k === tkey ? 'on' : ''}" data-t="${k}">${esc(n)}</button>`).join('');
  $('tsel').querySelectorAll('button').forEach(b => b.onclick = () => { tkey = b.dataset.t; drawHist(); });
  const tr = H.trades.filter(t => tkey === 'all' || t.trader === tkey);
  $('ttab').innerHTML = tr.length ? `<table class="num"><tr><th>날짜</th><th>트레이더</th><th>종목</th><th>셋업</th><th>진입→청산 (ET)</th><th class="r">수량</th>
      <th class="r">진입가</th><th class="r">청산가</th><th class="r">손익</th><th class="r">R</th><th class="r">최대 이익 R</th><th>청산 이유</th></tr>` +
      tr.map((t, i) => `<tr class="click" onclick="this.nextElementSibling.hidden=!this.nextElementSibling.hidden">
        <td>${t.date}</td><td><span class="sw" style="background:${TC[t.trader]}"></span>${esc(T[t.trader]?.nick || t.trader)}</td>
        <td><b>${esc(t.sym)}</b>${t.src === '새로 발견' ? ' <span class="muted">새로</span>' : ''}</td><td>${esc(t.setup)}</td><td>${t.entry_t}→${t.exit_t} (${Math.round(t.hold_min)}분)</td>
        <td class="r">${t.shares}</td><td class="r">${(+t.entry).toFixed(2)}</td><td class="r">${(+t.exit).toFixed(2)}</td>
        <td class="r ${cls(t.pnl)}">${sgn(t.pnl)}</td><td class="r ${cls(t.r)}">${t.r >= 0 ? '+' : ''}${t.r.toFixed(2)}</td>
        <td class="r">${t.mfe_r == null ? '-' : t.mfe_r.toFixed(2)}</td><td>${esc(t.exit_reason)}</td></tr>
        <tr class="det" hidden><td colspan="12"><b>진입 이유</b> ${esc(t.why_in)} · 점수 ${t.score ?? '-'} · 시장 ${t.mkt_score ?? '-'}점 · RVOL ${t.rvol != null ? (+t.rvol).toFixed(1) + '배' : '-'}
          · ATR ${t.atr_pct ? (t.atr_pct * 100).toFixed(1) + '%' : '-'} · 갭 ${t.gap ? pct(+t.gap, 1) : '-'} · 손절 ${(+t.stop0).toFixed(2)} · 위험 ${usd(+t.risk_usd)}<br>
          <b>청산 이유</b> ${esc(t.why_out)} · 규칙 ${esc(t.rules)}</td></tr>`).join('') + '</table>'
    : '<div class="empty">아직 청산된 거래가 없어요.</div>';
}

function drawEq(){
  const T = H.traders, keys = Object.keys(T);
  $('leg').innerHTML = keys.map(k => `<span><i style="background:${TC[k]}"></i>${esc(T[k].nick)} · ${esc(T[k].name)}</span>`).join('');
  const dates = [...new Set(keys.flatMap(k => T[k].curve.map(c => c.date)))].sort();
  if (dates.length < 1){ $('eqc').innerHTML = '<div class="empty">장이 하루 끝나면 첫 점이 찍혀요.</div>'; return; }
  const all = ['시작', ...dates];
  const ser = keys.map(k => { const m = Object.fromEntries(T[k].curve.map(c => [c.date, c.equity])); let v = 20000;
    return all.map((d, i) => i === 0 ? 20000 : (v = m[d] ?? v)); });
  const ys = ser.flat(), lo = Math.min(...ys), hi = Math.max(...ys), pad = (hi - lo || 200) * .15;
  const W = 1000, Hh = 260, l = 64, r = 90, t = 10, b = 26, y0 = lo - pad, y1 = hi + pad;
  const X = i => l + (all.length === 1 ? 0 : i / (all.length - 1) * (W - l - r)), Y = v => t + (1 - (v - y0) / (y1 - y0)) * (Hh - t - b);
  const ticks = [0, .25, .5, .75, 1].map(f => y0 + f * (y1 - y0));
  let s = `<svg viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none">` +
    ticks.map(v => `<line x1="${l}" x2="${W - r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${l - 8}" y="${Y(v) + 4}" font-size="11" fill="var(--sub)" text-anchor="end">${usd(v)}</text>`).join('') +
    `<line x1="${l}" x2="${W - r}" y1="${Y(20000)}" y2="${Y(20000)}" stroke="var(--mute)" stroke-dasharray="4 4"/>`;
  const step = Math.ceil(all.length / 8);
  const liveDay = keys.map(k => T[k].curve.find(c => c.live)?.date).find(Boolean);
  all.forEach((d, i) => { if (i % step === 0 || i === all.length - 1) s += `<text x="${X(i)}" y="${Hh - 6}" font-size="11" fill="var(--sub)" text-anchor="middle">${d === '시작' ? d : d === liveDay ? '오늘 (진행 중)' : d.slice(5)}</text>`; });
  keys.forEach((k, j) => {
    s += `<path d="${ser[j].map((v, i) => (i ? 'L' : 'M') + X(i) + ' ' + Y(v)).join('')}" fill="none" stroke="${TC[k]}" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
    const lv = ser[j][ser[j].length - 1];
    s += `<text x="${W - r + 8}" y="${Y(lv) + 4}" font-size="12" fill="var(--text)">${esc(T[k].nick)} ${usd(lv)}</text>`;
  });
  s += `<line id="xh" y1="${t}" y2="${Hh - b}" stroke="var(--mute)" visibility="hidden"/>` +
       `<rect x="${l}" y="0" width="${W - l - r}" height="${Hh}" fill="transparent" id="hit"/></svg><div class="tip" id="tip"></div>`;
  $('eqc').innerHTML = s;
  const svg = $('eqc').querySelector('svg'), tip = $('tip'), xh = $('xh');
  $('hit').onmousemove = ev => {
    const bx = svg.getBoundingClientRect(), fx = (ev.clientX - bx.left) / bx.width * W;
    const i = Math.max(0, Math.min(all.length - 1, Math.round((fx - l) / ((W - l - r) / Math.max(all.length - 1, 1)))));
    xh.setAttribute('x1', X(i)); xh.setAttribute('x2', X(i)); xh.setAttribute('visibility', 'visible');
    tip.style.display = 'block';
    tip.innerHTML = `<b>${all[i]}</b><br>` + keys.map((k, j) => `<span class="sw" style="background:${TC[k]}"></span>${esc(T[k].nick)} ${usd(ser[j][i])} <span class="${cls(ser[j][i] - 20000)}">${pct(ser[j][i] / 20000 - 1)}</span>`).join('<br>');
    const px = X(i) / W * bx.width;
    tip.style.left = Math.min(px + 12, bx.width - 190) + 'px'; tip.style.top = '10px';
  };
  $('hit').onmouseleave = () => { tip.style.display = 'none'; xh.setAttribute('visibility', 'hidden'); };
}

async function loadDay(){
  const d = $('dsel').value;
  if (!d){ $('rep').innerHTML = '<div class="empty">아직 기록된 날이 없어요.</div>'; return; }
  const evs = await (await fetch('/api/events?day=' + d)).json();
  $('rep').innerHTML = Object.keys(H.traders).map(k => `<div class="card" style="--c:${TC[k]}"><div class="who"><div class="av">${esc(H.traders[k].nick[0])}</div>
    <div class="n">${esc(H.traders[k].nick)}<span>${esc(H.traders[k].name)}</span></div></div><div class="feed" style="margin-top:10px">` +
    (evs.filter(e => e.trader === k).map(e => evRow(e, true)).join('') || '<div class="empty">기록 없음</div>') + '</div></div>').join('');
}
$('dsel').onchange = loadDay;

loadLive(); setInterval(loadLive, 5000);
setInterval(() => { if (!$('hist').hidden) loadHist(); }, 60000);
</script>
