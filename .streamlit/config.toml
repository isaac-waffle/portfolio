# 로컬 Streamlit 앱(트레이딩 데스크·어닝 대시보드) 공통 설정. 공책 테마 색 — 라이트·다크는 시스템 설정을 따름
# (줄 노트·펜 테두리·손글씨 제목은 apps/notebook_st.py)
[theme.light]
primaryColor = "#2b44b0"
backgroundColor = "#f8f5e9"
secondaryBackgroundColor = "#efe9d8"
textColor = "#1f2747"

[theme.dark]
primaryColor = "#93a7ff"
backgroundColor = "#17181d"
secondaryBackgroundColor = "#202229"
textColor = "#e7eaf6"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
