<html lang="en">
<head>

<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --soft:#f1f4f8; --pill:#eef1f5; --text:#0f172a; --sub:#475569; --mute:#94a3b8; --line:#e2e8f0;
  --accent:#1d3a8a; --ink:#0f172a; --up:#15803d; --down:#c2362c; --sketch:12px; --sketch2:12px;
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12141c; --card:#1a1d28; --soft:#222634; --pill:#262b3a; --text:#eceef6; --sub:#b3b8cc; --mute:#7f859d; --line:#2c3142;
  --accent:#93a7ff; --ink:#eceef6; --up:#4cc38a; --down:#ff7b72; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#12141c; --card:#1a1d28; --soft:#222634; --pill:#262b3a; --text:#eceef6; --sub:#b3b8cc; --mute:#7f859d; --line:#2c3142;
  --accent:#93a7ff; --ink:#eceef6; --up:#4cc38a; --down:#ff7b72; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background-color:var(--bg);color:var(--text);font-family:var(--font);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1160px;margin:0 auto;padding:0 clamp(16px,4vw,40px) 48px}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}.muted{color:var(--sub)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0;min-height:60px}
.back{font-size:14px;font-weight:500;color:var(--sub);text-decoration:none}
.back:hover{color:var(--accent)}
.seg{display:inline-flex;padding:2px;border-radius:8px;background:var(--pill);border:1px solid var(--line);flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 12px;border-radius:6px;font-size:13px;font-weight:600;color:var(--sub)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.top-end{display:flex;gap:8px;align-items:center}
.plain{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600}
.plain:hover{border-color:var(--accent)}
.plain:disabled{opacity:.5;cursor:default}

.hero{padding:14px 0 22px}
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--sub);letter-spacing:.06em;text-transform:uppercase}
.dot{width:8px;height:8px;border-radius:50%;background:var(--up);flex:none}
.dot.off{background:var(--mute)}
h1{font-weight:700;font-size:clamp(30px,5vw,44px);line-height:1.12;letter-spacing:-.03em;margin:10px 0 10px}
.lede{font-size:16px;color:var(--sub);max-width:64ch;margin:0}
.status{font-size:13px;color:var(--mute);margin-top:12px}

h2{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--sub);margin:30px 0 10px}
.note{font-size:12.5px;color:var(--mute);margin:12px 0 0;max-width:90ch}
.empty{padding:40px 16px;text-align:center;color:var(--sub);background:var(--card);border:1px solid var(--line);border-radius:12px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0;border-top:3px solid var(--c)}
.who{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.who b{font-size:18px;font-weight:700;letter-spacing:-.02em}
.who span{font-size:12.5px;font-weight:600;color:var(--sub)}
.big{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.15;margin-top:8px}
.big small{font-size:12.5px;font-weight:500;letter-spacing:0;color:var(--sub)}
.sub{font-size:13px;color:var(--sub)}
.rule{font-size:13.5px;color:var(--sub);margin:10px 0 0;line-height:1.5}
.pos{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.chip{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--pill);white-space:nowrap}
.chip small{font-weight:500;color:var(--sub);font-size:11.5px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--sub);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;background:var(--c)}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:9px 12px;text-align:right;white-space:nowrap;border-top:1px solid var(--line)}
thead th{border-top:0;font-size:11.5px;font-weight:600;color:var(--sub);background:var(--soft);letter-spacing:.02em}
th:first-child,td:first-child,.l{text-align:left}
td.wrapc{white-space:normal;min-width:220px;color:var(--sub)}
.sw{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:6px}
.facts{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.facts li{font-size:14px;line-height:1.55;padding-left:14px;border-left:2px solid var(--line)}
.facts b{font-weight:600}
.foot{font-size:12.5px;color:var(--mute);margin:26px 0 0;line-height:1.6}
.foot a{color:var(--sub);font-weight:500}
@media (max-width:980px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.cards{grid-template-columns:1fr}th,td{padding:8px 9px}.hide-s{display:none}}
</style>
</head>

    var lo = Math.min.apply(null, all), hi = Math.max.apply(null, all), pad = (hi - lo || .01) * .12; lo -= pad; hi += pad;
    var X = function (i) { return l + i / (xs.length - 1) * (W - l - rgt); }, Y = function (v) { return top + (1 - (v - lo) / (hi - lo)) * (H - top - bot); };
    var s = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(t("curveH")) + '">';
    for (var k = 0; k <= 4; k++) { var v = lo + k / 4 * (hi - lo); s += '<line x1="' + l + '" x2="' + (W - rgt) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="var(--line)"/><text x="' + (l - 8) + '" y="' + (Y(v) + 4) + '" font-size="12" fill="var(--sub)" text-anchor="end">' + pc(v) + "</text>"; }
    s += '<line x1="' + l + '" x2="' + (W - rgt) + '" y1="' + Y(0) + '" y2="' + Y(0) + '" stroke="var(--mute)" stroke-dasharray="4 4"/>';
    var step = Math.ceil(xs.length / 7);
    xs.forEach(function (d, i) { if (i % step === 0 || i === xs.length - 1) s += '<text x="' + X(i) + '" y="' + (H - 6) + '" font-size="12" fill="var(--sub)" text-anchor="middle">' + +d.slice(5, 7) + "/" + +d.slice(8) + "</text>"; });
    var ends = [];
    rows.forEach(function (r) {
      var m = {}; r.curve.forEach(function (c) { m[c[0]] = c[1]; });
      var first = xs.indexOf(r.curve.length ? r.curve[0][0] : xs[xs.length - 1]), v = 0, pts = [];
      xs.forEach(function (d, i) { if (i < first - 1) return; if (i === first - 1) { pts.push([i, 0]); return; } if (m[d] != null) v = m[d]; pts.push([i, v]); });
      if (pts.length === 1) pts.unshift([Math.max(pts[0][0] - 1, 0), 0]);
      s += '<path d="' + pts.map(function (p, i) { return (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1); }).join("") + '" fill="none" stroke="' + esc(r.color) + '" stroke-width="2.2" stroke-linejoin="round"/>';
      ends.push({ y: Y(pts[pts.length - 1][1]), r: r, v: pts[pts.length - 1][1] });
    });
    ends.sort(function (a, b) { return a.y - b.y; });
    for (var i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 15) ends[i].y = ends[i - 1].y + 15;  // keep end labels apart
    ends.forEach(function (e) { s += '<text x="' + (W - rgt + 8) + '" y="' + (e.y + 4) + '" font-size="12.5" font-weight="600" fill="' + esc(e.r.color) + '">' + esc(ko("names", e.r.name, e.r.name)) + " " + pc(e.v) + "</text>"; });
    return '<div class="panel chart"><div class="legend">' + rows.map(function (r) { return '<span style="--c:' + esc(r.color) + '"><i></i>' + esc(ko("names", r.name, r.name)) + " · " + esc(ko("style", r.key, r.style)) + "</span>"; }).join("") + "</div>" + s + "</svg></div>";
  }
  function trades(rows, col) {
    if (!rows.length) return '<div class="empty">' + t("noTrades") + "</div>";
    return '<div class="sheet"><table><thead><tr><th class="l">' + t("date") + '</th><th class="l">' + t("trader") + '</th><th class="l">' + t("ticker") + '</th><th class="l hide-s">' + t("setup") + '</th><th class="hide-s">' + t("held") + "</th><th>" + t("result") + "</th><th>" + t("pnl") + "</th></tr></thead><tbody>" +
      rows.map(function (r) {
        var h = r.hold_min == null ? "–" : r.hold_min >= 390 ? Math.max(1, Math.round(r.hold_min / 1440)) + t("dayU") : Math.round(r.hold_min) + " " + t("minU");
        return '<tr><td class="num">' + esc(r.date.slice(5).replace("-", "/")) + '</td><td class="l"><span class="sw" style="--c:' + esc(col[r.key] || "var(--mute)") + '"></span>' + esc(ko("names", r.trader, r.trader)) + '</td><td class="l"><b>' + esc(r.sym) + '</b></td><td class="l hide-s">' + esc(ko("setup", r.setup, r.setup)) +
          '</td><td class="num hide-s">' + h + '</td><td class="num ' + cls(r.ret) + '">' + pc(r.ret) + '</td><td class="num ' + cls(r.pnl) + '">' + (r.pnl == null ? "–" : (r.pnl >= 0 ? "+" : "") + usd(r.pnl)) + "</td></tr>";
      }).join("") + "</tbody></table></div>";
  }
  function rules(rows) {
    return '<div class="sheet"><table><thead><tr><th class="l">' + t("trader") + '</th><th class="l">' + t("style") + '</th><th class="l">' + t("rule") + "</th></tr></thead><tbody>" +
      rows.map(function (r) { return '<tr><td class="l"><span class="sw" style="--c:' + esc(r.color) + '"></span><b>' + esc(ko("names", r.name, r.name)) + '</b></td><td class="l">' + esc(ko("style", r.key, r.style)) + '</td><td class="l wrapc">' + esc(ko("rule", r.key, r.rule)) + "</td></tr>"; }).join("") + "</tbody></table></div>";
  }
  function render() {
    document.documentElement.lang = lang; document.title = t("doc");
    $("lang-en").setAttribute("aria-pressed", lang === "en"); $("lang-ko").setAttribute("aria-pressed", lang === "ko");
    document.querySelectorAll("[data-t]").forEach(function (el) { el.textContent = t(el.getAttribute("data-t")); });
    if (!D || !D.traders || !D.traders.length) { $("view").innerHTML = '<div class="empty">' + t(D ? "none" : "loading") + "</div>"; $("status").textContent = ""; return; }
    var when = new Date(D.updated * 1000).toLocaleString(lang === "ko" ? "ko-KR" : "en-GB", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
    $("dot").className = "dot" + (sample || D.state !== "Market open" ? " off" : "");
    $("status").textContent = sample ? fill(t("sample"), { t: when }) : fill(t("asof"), { s: ko("state", D.state, D.state), t: when, r: D.rules });
    var col = {}; D.traders.forEach(function (r) { col[r.key] = r.color; });
    $("view").innerHTML = '<div class="cards">' + D.traders.map(card).join("") + "</div>" +
      "<h2>" + t("curveH") + "</h2>" + chart(D.traders) + '<p class="note">' + t("curveNote") + "</p>" +
      "<h2>" + t("rulesH") + "</h2>" + rules(D.traders) +
      "<h2>" + t("tradesH") + "</h2>" + trades(D.trades || [], col) +
      "<h2>" + t("factsH") + '</h2><div class="panel"><ul class="facts">' + t("facts").map(function (f) { return "<li>" + f + "</li>"; }).join("") + "</ul></div>";
  }
  function setLang(l) { lang = l; try { localStorage.setItem("site-lang", l); localStorage.setItem("earn-lang", l); } catch (e) {} render(); }
  $("lang-en").onclick = function () { setLang("en"); };
  $("lang-ko").onclick = function () { setLang("ko"); };
  function load() {
    fetch(LIVE, { cache: "no-store" }).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (d) { if (!(d && d.traders)) throw 0; D = d; sample = false; render(); })
      .catch(function () { fetch(SAMPLE).then(function (r) { return r.json(); }).then(function (d) { D = d; sample = true; render(); }).catch(function () { D = {}; render(); }); });
  }
  render(); load();
})();
</script>
</body>
