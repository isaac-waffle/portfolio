<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Market Radar — Isaac Kim</title>
<meta name="description" content="Four things retail traders watch, on one page for a 50-stock watchlist: a heatmap, Reddit's most-mentioned tickers, unusual options volume and insider trades.">
<meta property="og:title" content="Market Radar — heatmap, Reddit buzz, unusual options, insider trades">
<meta property="og:description" content="Four popular trader views built on free data, refreshed every two hours.">
<meta property="og:type" content="website">
<link rel="icon" href="../assets/img/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* This one file is also the local app's screen: apps/radar.py serves it with the notebook theme injected,
   which overrides the colour variables below (same names as apps/notebook.css). */
:root{
  --bg:#f6f7f9; --card:#ffffff; --soft:#f1f4f8; --pill:#eef1f5; --text:#0f172a; --sub:#475569; --mute:#94a3b8; --line:#e2e8f0;
  --accent:#1d3a8a; --ink:#0f172a; --up:#15803d; --down:#c2362c; --sketch:12px; --sketch2:12px;
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12141c; --card:#1a1d28; --soft:#222634; --pill:#262b3a; --text:#eceef6; --sub:#b3b8cc; --mute:#7f859d; --line:#2c3142;
  --accent:#93a7ff; --ink:#eceef6; --up:#4cc38a; --down:#ff7b72; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#12141c; --card:#1a1d28; --soft:#222634; --pill:#262b3a; --text:#eceef6; --sub:#b3b8cc; --mute:#7f859d; --line:#2c3142;
  --accent:#93a7ff; --ink:#eceef6; --up:#4cc38a; --down:#ff7b72; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background-color:var(--bg);color:var(--text);font-family:var(--font);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1160px;margin:0 auto;padding:0 clamp(16px,4vw,40px) 48px}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}.muted{color:var(--sub)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0;min-height:60px}
.back{font-size:14px;font-weight:500;color:var(--sub);text-decoration:none}
.back:hover{color:var(--accent)}
.seg{display:inline-flex;padding:2px;border-radius:8px;background:var(--pill);border:1px solid var(--line);flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 12px;border-radius:6px;font-size:13px;font-weight:600;color:var(--sub)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.top-end{display:flex;gap:8px;align-items:center}
.plain{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600}
.plain:hover{border-color:var(--accent)}
.plain:disabled{opacity:.5;cursor:default}

.hero{padding:14px 0 22px}
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--sub);letter-spacing:.06em;text-transform:uppercase}
.dot{width:8px;height:8px;border-radius:50%;background:var(--up);flex:none}
.dot.off{background:var(--mute)}
h1{font-weight:700;font-size:clamp(30px,5vw,44px);line-height:1.12;letter-spacing:-.03em;margin:10px 0 10px}
.lede{font-size:16px;color:var(--sub);max-width:64ch;margin:0}
.status{font-size:13px;color:var(--mute);margin-top:12px}

.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:10px 14px;font-size:14.5px;font-weight:600;color:var(--sub);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.headline{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin-bottom:14px}
.headline p{margin:0;font-size:15.5px;font-weight:600}
.headline p span{font-weight:400;color:var(--sub)}
.note{font-size:12.5px;color:var(--mute);margin:14px 0 0;max-width:90ch}
h2{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--sub);margin:22px 0 10px}
.empty{padding:40px 16px;text-align:center;color:var(--sub);background:var(--card);border:1px solid var(--line);border-radius:var(--sketch)}

/* heatmap */
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));grid-auto-rows:62px;grid-auto-flow:dense;gap:4px}
.cell{border-radius:6px;padding:7px 9px;min-width:0;overflow:hidden;display:flex;flex-direction:column;justify-content:center;
  background:color-mix(in srgb,var(--c) var(--a),var(--card));border:1px solid color-mix(in srgb,var(--c) 30%,var(--line))}
.cell b{font-size:13.5px;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell span{font-size:12.5px;font-weight:600}
.cell small{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell.s2{grid-column:span 2}.cell.s3{grid-column:span 2;grid-row:span 2}.cell.s4{grid-column:span 3;grid-row:span 2}
.cell.s3 b,.cell.s4 b{font-size:20px}.cell.s3 span,.cell.s4 span{font-size:16px}
.scale{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
.scale i{width:22px;height:10px;border-radius:2px;background:color-mix(in srgb,var(--c) var(--a),var(--card))}

/* tables */
.sheet{background:var(--card);border:1px solid var(--line);border-radius:var(--sketch);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:9px 12px;text-align:right;white-space:nowrap;border-top:1px solid var(--line)}
thead th{border-top:0;font-size:11.5px;font-weight:600;color:var(--sub);background:var(--soft);letter-spacing:.02em}
th:first-child,td:first-child,.l{text-align:left}
td b{font-weight:700}
td.nm{max-width:220px;overflow:hidden;text-overflow:ellipsis;color:var(--sub)}
.star{color:var(--accent);margin-left:4px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px}
.tag.c,.tag.buy{background:color-mix(in srgb,var(--up) 15%,transparent);color:var(--up)}
.tag.p,.tag.sell{background:color-mix(in srgb,var(--down) 14%,transparent);color:var(--down)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:6px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--sketch);padding:14px 16px}
.tile .l{font-size:12.5px;font-weight:600;color:var(--sub);text-align:left}
.tile .v{font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1.15;color:var(--c)}
.tile .s{font-size:12.5px;color:var(--sub)}
.split{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--pill);min-width:180px;flex:1;max-width:360px}
.split i:first-child{background:var(--up)}.split i:last-child{background:var(--down)}
.foot{font-size:12.5px;color:var(--mute);margin:26px 0 0;line-height:1.6}
.foot a{color:var(--sub);font-weight:500}
@media (max-width:640px){
  .heat{grid-template-columns:repeat(auto-fill,minmax(74px,1fr));grid-auto-rows:56px}
  .cell.s4{grid-column:span 2}
  th,td{padding:8px 9px}
  .hide-s{display:none}
}
</style>
</head>

<div class="wrap">
  <div class="top">

      <button class="plain" type="button" id="refresh" hidden></button>

        <button type="button" id="lang-ko" aria-pressed="false">한국어</button>

  </div>
  <header class="hero">

      R.map(function (r) {
        var mv = r.rank0 ? r.rank0 - r.rank : 0;
        return '<tr><td class="num">' + r.rank + ' <span class="' + (mv > 0 ? "up" : mv < 0 ? "down" : "muted") + '" style="font-size:12px">' + (mv > 0 ? "▲" + mv : mv < 0 ? "▼" + -mv : "") + '</span></td><td class="l"><b>' + esc(r.sym) + "</b>" + (r.mine ? '<span class="star" title="' + t("mine") + '">★</span>' : "") + '</td><td class="l nm hide-s">' + esc(r.name) + '</td><td class="num">' + int(r.mentions) + '</td><td class="num ' + cls(r.surge) + '">' + pc(r.surge, 0) + '</td><td class="num hide-s">' + int(r.upvotes) + '</td><td class="num ' + cls(r.chg) + '">' + pc(r.chg) + "</td></tr>";
      }).join("") + '</tbody></table></div><p class="note">' + t("redNote") + "</p>";
  }
  function options() {
    var O = D.options; if (!O || !O.rows.length) return '<div class="empty">' + t("none") + "</div>";
    var tot = O.calls + O.puts || 1;
    return '<div class="headline"><p>' + fill(t("optHead"), { c: money(O.calls), p: money(O.puts), n: O.n }) + '</p><div class="split"><i style="width:' + (O.calls / tot * 100).toFixed(1) + '%"></i><i style="width:' + (O.puts / tot * 100).toFixed(1) + '%"></i></div></div>' +
      '<div class="sheet"><table><thead><tr><th class="l">' + t("contract") + "</th><th>" + t("exp") + "</th><th>" + t("prem") + "</th><th>" + t("vol") + '</th><th class="hide-s">' + t("oi") + "</th><th>" + t("ratio") + '</th><th class="hide-s">' + t("iv") + '</th><th class="hide-s">' + t("otm") + "</th></tr></thead><tbody>" +
      O.rows.map(function (r) {
        return '<tr><td class="l"><b>' + esc(r.sym) + '</b> <span class="num">' + r.strike + '</span> <span class="tag ' + (r.kind === "C" ? "c" : "p") + '">' + t(r.kind === "C" ? "call" : "put") + '</span></td><td class="num">' + day(r.exp) + '</td><td class="num"><b>' + money(r.prem) + '</b></td><td class="num">' + int(r.vol) + '</td><td class="num hide-s">' + int(r.oi) + '</td><td class="num">' + (r.ratio >= 100 ? "100×+" : r.ratio.toFixed(1) + "×") + '</td><td class="num hide-s">' + (r.iv != null ? (r.iv * 100).toFixed(0) + "%" : "–") + '</td><td class="num hide-s">' + (r.otm != null ? pc(r.otm * (r.kind === "C" ? 1 : -1), 0) : "–") + "</td></tr>";
      }).join("") + '</tbody></table></div><p class="note">' + t("optNote") + "</p>";
  }
  function insiders() {
    var I = D.insiders; if (!I || !I.rows.length) return '<div class="empty">' + t("none") + "</div>";
    var tbl = function (rows) {
      return '<div class="sheet"><table><thead><tr><th class="l">' + t("ticker") + "</th><th>" + t("date") + '</th><th class="l">' + t("who") + '</th><th class="l hide-s">' + t("role") + '</th><th class="hide-s">' + t("shares") + "</th><th>" + t("value") + "</th></tr></thead><tbody>" +
        rows.map(function (r) { return '<tr><td class="l"><b>' + esc(r.sym) + '</b></td><td class="num">' + day(r.date) + '</td><td class="l nm">' + esc(r.who) + '</td><td class="l nm hide-s">' + esc(r.role) + '</td><td class="num hide-s">' + int(r.shares) + '</td><td class="num ' + (r.side === "buy" ? "up" : "") + '"><b>' + money(r.value) + "</b></td></tr>"; }).join("") + "</tbody></table></div>";
    };
    var buys = I.rows.filter(function (r) { return r.side === "buy"; }), sells = I.rows.filter(function (r) { return r.side === "sell"; });
    return '<div class="tiles"><div class="tile" style="--c:var(--up)"><div class="l">' + t("insBuys") + '</div><div class="v num">' + money(I.buy_value) + '</div><div class="s">' + fill(t("insS"), { n: I.buys }) + '</div></div><div class="tile" style="--c:var(--down)"><div class="l">' + t("insSells") + '</div><div class="v num">' + money(I.sell_value) + '</div><div class="s">' + fill(t("insS"), { n: I.sells }) + "</div></div></div>" +
      "<h2>" + t("insBuys") + "</h2>" + (buys.length ? tbl(buys) : '<div class="empty">' + t("noBuys") + "</div>") + "<h2>" + t("insSells") + "</h2>" + tbl(sells) + '<p class="note">' + t("insNote") + "</p>";
  }
  var VIEWS = { heat: heat, reddit: reddit, options: options, insiders: insiders };

  function render() {
    document.documentElement.lang = lang; document.title = t("doc");
    $("lang-en").setAttribute("aria-pressed", lang === "en"); $("lang-ko").setAttribute("aria-pressed", lang === "ko");
    document.querySelectorAll("[data-t]").forEach(function (el) { el.textContent = t(el.getAttribute("data-t")); });
    if (LOCAL) document.querySelector('[data-t="kicker"]').textContent = lang === "ko" ? "실시간 · 가격과 레딧은 15분마다 갱신" : "Live · prices and Reddit refresh every 15 minutes";
    $("tabs").innerHTML = Object.keys(VIEWS).map(function (k) { return '<button type="button" role="tab" data-tab="' + k + '" aria-selected="' + (k === tab) + '">' + t("tabs")[k] + "</button>"; }).join("");
    if (LOCAL) { $("back").hidden = true; $("links").hidden = true; $("refresh").hidden = false; $("refresh").textContent = D && D.loading ? t("refreshing") : t("refresh"); $("refresh").disabled = !!(D && D.loading); }
    if (!D || !D.updated) { $("view").innerHTML = '<div class="empty">' + t(D ? "none" : "loading") + "</div>"; $("status").textContent = ""; return; }
    var when = new Date(D.updated * 1000).toLocaleString(lang === "ko" ? "ko-KR" : "en-GB", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
    $("dot").className = "dot" + (sample ? " off" : "");
    $("status").textContent = fill(t(sample ? "sample" : "asof"), { t: when });
    $("view").innerHTML = VIEWS[tab]();
  }
  function setLang(l) { lang = l; try { localStorage.setItem("site-lang", l); localStorage.setItem("earn-lang", l); } catch (e) {} render(); }
  $("lang-en").onclick = function () { setLang("en"); };
  $("lang-ko").onclick = function () { setLang("ko"); };
  $("tabs").onclick = function (e) { var b = e.target.closest("[data-tab]"); if (!b) return; tab = b.getAttribute("data-tab"); try { history.replaceState(null, "", "#" + tab); } catch (x) {} render(); };
  $("view").onclick = function (e) { var b = e.target.closest("[data-per]"); if (b) { per = b.getAttribute("data-per"); render(); } };
  $("refresh").onclick = function () { fetch("/api/refresh", { method: "POST" }).then(function () { if (D) D.loading = true; render(); setTimeout(load, 3000); }); };

  function load() {
    fetch(LIVE, { cache: "no-store" }).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (d) {
      if (!LOCAL && !(d && d.heat)) throw 0; D = d; sample = false; render();
      if (LOCAL) setTimeout(load, d.loading || !d.updated ? 3000 : 60000);
    }).catch(function () {
      if (LOCAL) { setTimeout(load, 5000); return; }
      fetch(SAMPLE).then(function (r) { return r.json(); }).then(function (d) { D = d; sample = true; render(); }).catch(function () { D = {}; render(); });
    });
  }
  render(); load();
})();
</script>
</body>
</html>
