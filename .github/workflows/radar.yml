name: Update Market Radar

# Every 2 hours: heatmap returns, Reddit mentions, unusual options volume and insider trades for the watchlist, as one JSON file.
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['apps/radar.py', 'apps/earnings_app.py', '.github/workflows/radar.yml']

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install yfinance==1.7.0

      # Exits non-zero (and publishes nothing) when Yahoo returns no prices, so the last good file stays.
      - run: python apps/radar.py --out out

      - name: Publish to the radar-data branch (single commit, force-pushed)
        working-directory: out
        run: |
          rm -rf .git
          git init -q -b radar-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar.json
          git commit -q -m "radar $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" radar-data
