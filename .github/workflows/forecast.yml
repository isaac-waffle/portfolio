name: Update forecasts

# Every 15 minutes across the US session (covers both EDT and EST), weekdays.
on:
  schedule:
    - cron: '*/15 13-21 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['forecast/**', '.github/workflows/forecast.yml']

permissions:
  contents: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: forecast/requirements.txt

      - run: pip install -r forecast/requirements.txt

      - name: Restore previous forecast + forward-test log
        run: |
          mkdir -p out
          if git fetch --depth=1 origin data 2>/dev/null; then
            git show FETCH_HEAD:forecast.json > out/forecast.json || true
            git show FETCH_HEAD:history.json > out/history.json || true
          fi

      - run: python forecast/forecast.py --out out

      - name: Publish to the data branch (single commit, force-pushed)
        working-directory: out
        run: |
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecast.json history.json
          git commit -q -m "forecast $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
