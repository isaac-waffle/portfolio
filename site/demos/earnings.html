<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Earnings Desk</title>
<meta name="description" content="Upcoming US earnings for a watchlist and the whole market, with company profiles, price analysis, past earnings reactions and options-implied moves. English and Korean.">
<link rel="icon" href="../assets/img/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: top bar → calendar (watchlist | all US) or ticker detail (header + section nav + 8 stacked sections). One column, max 1120px */
:root{
  --bg:#f4f5f7; --surface:#ffffff; --cell:#f6f7f9; --seg-bg:#e9ecf0;
  --ink:#0f1419; --ink2:#525d6b; --muted:#8892a0; --line:#e6e9ee; --axis:#cdd3db; --hover:rgba(15,20,25,.05);
  --gain:#0e9f8e; --gain-ink:#06695c; --loss:#e5484d; --loss-ink:#c0252a; --blue:#2f6fe0; --amber:#d08a00; --violet:#7c5cd6;
  --accent:#0f1419; --accent-ink:#ffffff; --focus:#2f6fe0;
  --note-bg:#fff6e0; --note-ink:#6b4a00; --note-line:#f0dba5; --shadow:0 1px 2px rgba(15,20,25,.05),0 8px 24px rgba(15,20,25,.04);
  --font:"IBM Plex Sans","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0e12; --surface:#14181e; --cell:#1a1f26; --seg-bg:#232932;
    --ink:#eef1f5; --ink2:#b4bcc8; --muted:#8a93a0; --line:#232932; --axis:#394150; --hover:rgba(255,255,255,.06);
    --gain:#16a493; --gain-ink:#4fd6c4; --loss:#e45e5e; --loss-ink:#ff9ea1; --blue:#5b94f5; --amber:#e3a52b; --violet:#a28bf0;
    --accent:#eef1f5; --accent-ink:#0b0e12; --focus:#7aa8ff;
    --note-bg:#2a2412; --note-ink:#e9c76a; --note-line:#4a3f1c; --shadow:0 0 0 1px rgba(255,255,255,.02);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0e12; --surface:#14181e; --cell:#1a1f26; --seg-bg:#232932;
  --ink:#eef1f5; --ink2:#b4bcc8; --muted:#8a93a0; --line:#232932; --axis:#394150; --hover:rgba(255,255,255,.06);
  --gain:#16a493; --gain-ink:#4fd6c4; --loss:#e45e5e; --loss-ink:#ff9ea1; --blue:#5b94f5; --amber:#e3a52b; --violet:#a28bf0;
  --accent:#eef1f5; --accent-ink:#0b0e12; --focus:#7aa8ff;
  --note-bg:#2a2412; --note-ink:#e9c76a; --note-line:#4a3f1c; --shadow:0 0 0 1px rgba(255,255,255,.02);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 56px}
.wrap{max-width:1120px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em}
h2{font-size:16px;font-weight:600;margin:0;text-wrap:balance}
h3{font-size:13px;font-weight:600;margin:0;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
p{margin:0}
a{color:var(--blue)}
.sub{color:var(--ink2);font-size:13px}
.mut{color:var(--muted)}
.g{color:var(--gain-ink)} .r{color:var(--loss-ink)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12.5px}
button,select,input{font-family:inherit;font-size:13px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.brand{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;min-width:0}
.brand a.home{color:var(--ink2);text-decoration:none;font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{font-size:12px;color:var(--ink2);background:var(--surface);border-radius:999px;padding:3px 10px;box-shadow:0 0 0 1px var(--line);white-space:nowrap}
.pill.warn{color:var(--note-ink);background:var(--note-bg);box-shadow:0 0 0 1px var(--note-line)}
.btn{font-weight:500;border:0;background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 14px;cursor:pointer;box-shadow:0 0 0 1px var(--axis)}
.btn:hover{background:var(--hover)}
.seg{display:inline-flex;background:var(--seg-bg);border-radius:10px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{background:transparent;color:var(--ink2);border:0;border-radius:8px;padding:6px 14px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.14)}

.card{background:var(--surface);border-radius:14px;box-shadow:var(--shadow),0 0 0 1px var(--line);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;justify-content:space-between}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tiles.t5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:760px){.tiles.t5{grid-template-columns:repeat(2,minmax(0,1fr))}.tiles.t5 .tile:last-child{grid-column:span 2}}
.tile{background:var(--cell);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .k{font-size:12px;color:var(--ink2)}
.tile .v{font-size:20px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile .s{font-size:12px;color:var(--muted)}
.note{background:var(--note-bg);color:var(--note-ink);border-radius:10px;padding:10px 12px;font-size:13px;box-shadow:0 0 0 1px var(--note-line)}
.grid2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:820px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}

.tbl-wrap{overflow-x:auto;border-radius:10px;box-shadow:0 0 0 1px var(--line)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{background:var(--cell);text-align:left;font-weight:500;font-size:12px;color:var(--ink2);padding:8px 10px;white-space:nowrap;position:sticky;top:0}
td{padding:8px 10px;border-top:1px solid var(--line);white-space:nowrap}
td.n,th.n{text-align:right}
tr.go{cursor:pointer;user-select:none}
tr.go:hover td{background:var(--hover)}
tr.off td{color:var(--muted)}
.tk{font-weight:600}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--blue);margin-right:6px;vertical-align:middle}
.dd{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;background:var(--cell);color:var(--ink2)}
.dd.hot{background:var(--accent);color:var(--accent-ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px}
.kv dt{color:var(--ink2)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.filters label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--ink2)}
.filters select,.filters input{background:var(--surface);color:var(--ink);border:0;box-shadow:0 0 0 1px var(--axis);border-radius:8px;padding:6px 10px}
.filters input{min-width:0;width:220px;max-width:100%}
.day-head{display:flex;gap:10px;align-items:baseline;margin-top:6px}

.dhead{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.dhead .price{font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.secnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.secnav a{flex:none;font-size:13px;text-decoration:none;color:var(--ink2);background:var(--surface);box-shadow:0 0 0 1px var(--line);border-radius:999px;padding:5px 12px}
.secnav a:hover{color:var(--ink)}
.chart{width:100%;min-width:0;position:relative}
.chart svg{display:block;width:100%}
.tip{position:absolute;left:0;top:0;pointer-events:none;z-index:3;background:var(--surface);color:var(--ink);border-radius:9px;padding:8px 10px;font-size:12px;line-height:1.5;white-space:nowrap;font-variant-numeric:tabular-nums;box-shadow:0 0 0 1px var(--line),0 8px 24px rgba(15,20,25,.14);min-width:170px}
.tip .h{font-weight:600;margin-bottom:3px}
.tip .row{display:flex;justify-content:space-between;gap:16px}
.tip .row span:first-child{color:var(--ink2)}
.tip .sec{margin-top:6px;padding-top:5px;border-top:1px solid var(--line);font-weight:600}
.readout{font-size:12px;color:var(--ink2);min-height:18px;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.seglist{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.news{display:flex;flex-direction:column}
.news a{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.news a:first-child{border-top:0}
.news a:hover .t{text-decoration:underline}
.news .m{font-size:12px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:6px}
.bars .row{display:grid;grid-template-columns:90px 1fr 32px;gap:8px;align-items:center;font-size:12px}
.bars .track{height:10px;background:var(--cell);border-radius:5px;overflow:hidden}
.bars .fill{height:100%;border-radius:5px}
.overview{max-width:68ch;line-height:1.65}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
.foot{font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <div class="brand">
      <a class="home" href="../#work" data-i18n="home">← Portfolio</a>
      <h1 id="title">Earnings Desk</h1>
      <span class="pill" id="updated">Loading…</span>
    </div>
    <div class="actions">
      <button class="btn" id="back" hidden data-i18n="back">← Calendar</button>
      <div class="seg" role="group" aria-label="Language">
        <button id="lang-en" aria-pressed="true">English</button>
        <button id="lang-ko" aria-pressed="false">Korean</button>
      </div>
    </div>
  </header>
  <main id="view"><div class="empty" data-i18n="loading">Loading the latest data…</div></main>
  <p class="foot" data-i18n="foot">All times are Amsterdam time (CET/CEST). Data: Yahoo Finance, Nasdaq earnings calendar and Google News, refreshed every few hours by a scheduled GitHub Actions job. Analysis only, not investment advice.</p>
</div>

    var ndd = nx.date ? daysBetween(today, nx.date) : null;
    var h = '<div style="display:flex;flex-direction:column;gap:16px">';
    h += '<div class="dhead"><div style="min-width:0"><p class="sub">' + esc([d.sym, d.exchange, d.sector].filter(Boolean).join(" · ")) + '</p><h2 style="font-size:24px">' + esc(d.name) + '</h2></div><div style="text-align:right"><div class="price">' + usd(d.price) +
      '</div><div class="num ' + cls(chg) + '">' + pct(chg, 2) + "</div></div></div>";
    h += '<div class="tiles t5">' + tile(t("mcap"), big(d.mc)) + tile(t("size"), sizeName(d.mc)) +
      tile(t("nextE"), nx.date ? earnWhen(nx.timing, nx.date, nx.ts) : d.crypto ? t("noE") : "–", nx.date ? ddLabel(ndd) + " · " + timingName(nx.timing) + " · " + t("ams") + (nx.estimated ? " · " + t("estimated") : "") : "") +
      tile(t("epsEst"), num(nx.eps_avg), isNum(nx.rev_avg) ? t("revenue") + " " + big(nx.rev_avg) : "") + tile(t("sector"), d.sector || "–", d.industry || "") + "</div>";
    var secs = [["company", t("secCompany")], ["price", t("secPrice")], ["past", t("secPast")], ["outlook", t("secOutlook")], ["size", t("secSize")], ["fund", t("secFund")], ["news", t("secNews")], ["recent", t("secRecent")]];
    h += '<nav class="secnav" aria-label="Sections">' + secs.map(function (s) { return '<a href="#' + d.sym + "/" + s[0] + '">' + esc(s[1]) + "</a>"; }).join("") + "</nav>";
    if (d.crypto) h += '<div class="note">' + esc(t("crypto")) + "</div>";

    /* 1 company */
    var ov, segs = "";
    if (lang === "ko" && d.ko) { ov = '<p class="overview">' + esc(d.ko.overview) + "</p>"; if (d.ko.segments && d.ko.segments.length) segs = "<h3>" + t("segments") + '</h3><ul class="seglist">' + d.ko.segments.map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ul>"; }
    else ov = (lang === "ko" && d.summary ? '<p class="note">' + esc(t("noKo")) + "</p>" : "") + '<p class="overview">' + esc(d.summary || "–") + "</p>";
    var f = d.fin || {};
    var facts = [[t("industry"), esc(d.industry || "–")], [t("country"), esc(d.country || "–")], [t("employees"), isNum(d.employees) ? num(d.employees, 0) : "–"]];
    if (d.website) facts.push([t("website"), '<a href="' + esc(d.website) + '" target="_blank" rel="noopener">' + esc(d.website.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "")) + "</a>"]);
    h += sec("company", t("secCompany"), '<div class="grid2"><div style="display:flex;flex-direction:column;gap:12px;min-width:0"><h3>' + t("overview") + "</h3>" + ov + segs + "</div>" +
      '<div style="display:flex;flex-direction:column;gap:14px;min-width:0"><h3>' + t("keyFin") + "</h3>" +
      kv([[t("revTTM"), big(f.rev)], [t("revG"), pct(f.rev_g), cls(f.rev_g)], [t("epsG"), pct(f.eps_g), cls(f.eps_g)], [t("gm"), pct(f.gm, 1, true)], [t("om"), pct(f.om, 1, true)], [t("pm"), pct(f.pm, 1, true)], [t("roe"), pct(f.roe, 1, true)], [t("fcf"), big(f.fcf)]]) +
      kv(facts) + "</div></div>" + (d.quarterly && d.quarterly.length ? "<h3>" + t("quarterly") + '</h3><div class="legend"><span><i style="background:var(--blue)"></i>' + t("revenue") + '</span><span><i style="background:var(--gain)"></i>' + t("netIncome") + '</span></div><div class="chart" id="c-q"></div>' : ""));

    /* 2 price */
    var rows = d.ohlc, last = rows[rows.length - 1], p = last[4], ma50 = last[6], ma200 = last[7], r14 = last[8], R = d.ret || {};
    var trend = p > ma50 && ma50 > ma200 ? "up" : p < ma50 && ma50 < ma200 ? "down" : "mixed";
    var pos = isNum(d.hi52) && d.hi52 > d.lo52 ? (p - d.lo52) / (d.hi52 - d.lo52) : null;
    var rngs = [[63, "3M"], [126, "6M"], [252, "1Y"], [504, "2Y"]];
    h += sec("price", t("secPrice"), '<div class="seg" role="group" aria-label="Range" style="align-self:flex-start">' + rngs.map(function (r) { return '<button data-range="' + r[0] + '" aria-pressed="' + (S.range === r[0]) + '">' + r[1] + "</button>"; }).join("") + "</div>" +
      '<div class="legend"><span><i style="background:var(--amber)"></i>' + t("ma50") + '</span><span><i style="background:var(--violet)"></i>' + t("ma200") + '</span><span><i style="background:var(--blue)"></i>' + t("rsi") + '</span><span class="mut">' + t("earnMark") + "</span></div>" +
      '<div class="readout"></div><div class="chart" id="c-price"></div>' +
      '<div class="tiles">' + [["ret1w", R["1w"]], ["ret1m", R["1m"]], ["ret3m", R["3m"]], ["ret6m", R["6m"]], ["ytd", R.ytd], ["ret1y", R["1y"]], ["vsSpy", isNum(R["1y"]) && isNum(R.spy1y) ? R["1y"] - R.spy1y : null]].map(function (k) { return tile(t(k[0]), pct(k[1]), "", cls(k[1])); }).join("") + "</div>" +
      '<ul class="seglist"><li><b>' + t("trend") + ":</b> " + t(trend) + " " + t("ma50") + " " + usd(ma50) + ' (<span class="' + cls(p / ma50 - 1) + '">' + pct(p / ma50 - 1) + "</span>), " + t("ma200") + " " + usd(ma200) + ' (<span class="' + cls(p / ma200 - 1) + '">' + pct(p / ma200 - 1) + "</span>)</li>" +
      "<li><b>" + t("rsiL") + ":</b> " + (isNum(r14) ? r14.toFixed(0) + " · " + (r14 >= 70 ? t("overbought") : r14 <= 30 ? t("oversold") : t("neutral")) : "–") + "</li>" +
      "<li><b>" + t("range52") + ":</b> " + usd(d.lo52) + " – " + usd(d.hi52) + (pos != null ? ", " + t("position") + " " + Math.round(pos * 100) + "% · " + pct(p / d.hi52 - 1) + " " + t("offHigh") : "") + "</li>" +
      "<li><b>" + t("vol") + ":</b> " + pct(d.vol3m, 0, true) + " · " + t("beta") + " " + num((d.health || {}).beta) + "</li></ul>");

    /* 3 past earnings */
    var re = d.reactions || [];
    if (!re.length) h += sec("past", t("secPast"), '<p class="sub">' + t("noPast") + "</p>");
    else {
      var days = re.map(function (r) { return r.day; }).filter(isNum), abs = days.map(Math.abs);
      var mean = function (a) { return a.length ? a.reduce(function (x, y) { return x + y; }, 0) / a.length : null; };
      var beats = re.filter(function (r) { return isNum(r.sur) && r.sur > 0; });
      h += sec("past", t("secPast"), '<div class="tiles t5">' + tile(t("reports"), re.length) + tile(t("upRate"), Math.round(days.filter(function (v) { return v > 0; }).length / days.length * 100) + "%") +
        tile(t("avgMove"), "±" + pct(mean(abs), 1, true)) + tile(t("beatRate"), Math.round(beats.length / re.length * 100) + "%") +
        tile(t("maxMove"), pct(Math.max.apply(null, days)) + " / " + pct(Math.min.apply(null, days))) + "</div>" +
        '<div class="chart" id="c-react"></div>' +
        '<div class="tbl-wrap"><table><thead><tr><th>' + t("date") + "</th><th>" + t("timing") + '</th><th class="n">' + t("est") + '</th><th class="n">' + t("actual") + '</th><th class="n">' + t("surprise") +
        '</th><th class="n">' + t("gap") + '</th><th class="n">' + t("reacDay") + '</th><th class="n">' + t("w5") + "</th></tr></thead><tbody>" +
        re.map(function (r) { return "<tr><td>" + fmtDate(r.date) + "</td><td>" + timingName(r.timing) + '</td><td class="n">' + num(r.est) + '</td><td class="n">' + num(r.act) + '</td><td class="n ' + cls(r.sur) + '">' + pct(r.sur) +
          '</td><td class="n ' + cls(r.gap) + '">' + pct(r.gap) + '</td><td class="n ' + cls(r.day) + '"><b>' + pct(r.day) + '</b></td><td class="n ' + cls(r.w5) + '">' + pct(r.w5) + "</td></tr>"; }).join("") +
        '</tbody></table></div><p class="sub">' + t("reacNote") + "</p>");
    }

    /* 4 outlook */
    var im = d.implied, histMove = re.length ? (function () { var a = re.map(function (r) { return Math.abs(r.day); }).filter(isNum); return a.reduce(function (x, y) { return x + y; }, 0) / a.length; })() : null;
    var o = '<div class="note">' + esc(t("disclaimer")) + "</div>";
    if (!nx.date) o += '<p class="sub">' + t("noNext") + "</p>";
    else {
      var ratio = im && isNum(histMove) ? histMove / im.move : null, move = im ? im.move : histMove;
      o += '<div class="tiles">' + tile(t("nextE"), earnWhen(nx.timing, nx.date, nx.ts), ddLabel(ndd) + " · " + timingName(nx.timing) + " · " + t("ams")) +
        tile(t("implied"), im ? "±" + pct(im.move, 1, true) : "–", im ? t("expiry") + " " + fmtDate(im.expiry).replace(/, \d{4}/, "") + " · " + t("strike") + " " + num(im.strike, im.strike % 1 ? 1 : 0) : "") +
        tile(t("histMove"), isNum(histMove) ? "±" + pct(histMove, 1, true) : "–") +
        (ratio != null ? tile(t("ratio"), ratio.toFixed(2) + "×", ratio < 1 ? t("ratioLo") : t("ratioHi")) : "") + "</div>";
      if (isNum(move) && move > 0) o += "<h3>" + t("rangeTitle") + '</h3><div class="chart" id="c-range"></div><p class="sub">' + t("rangeNote") + "</p>";
      if (re.length) {
        var all = re.filter(function (r) { return isNum(r.day); }).map(function (r) { return r.day; });
        var b = re.filter(function (r) { return isNum(r.sur) && r.sur > 0 && isNum(r.day); }).map(function (r) { return r.day; }), m = re.filter(function (r) { return isNum(r.sur) && r.sur <= 0 && isNum(r.day); }).map(function (r) { return r.day; });
        /* odds and size of each direction: P(up), mean move on up days, P(down), mean move on down days */
        var split = function (a) {
          var avg = function (x) { return x.length ? x.reduce(function (p, q) { return p + q; }, 0) / x.length : null; };
          var u = a.filter(function (v) { return v > 0; }), dn = a.filter(function (v) { return v <= 0; });
          return { n: a.length, avg: avg(a), pu: a.length ? u.length / a.length : null, mu: avg(u), pd: a.length ? dn.length / a.length : null, md: avg(dn) };
        };
        var A = split(all), pp = function (x) { return x == null ? "–" : Math.round(x * 100) + "%"; };
        o += "<h3>" + t("odds") + '</h3><div class="tiles">' +
          tile(t("upProb"), pp(A.pu), t("avgRise") + " " + pct(A.mu) + (isNum(A.mu) ? " → " + usd(d.price * (1 + A.mu)) : ""), "g") +
          tile(t("downProb"), pp(A.pd), t("avgDrop") + " " + pct(A.md) + (isNum(A.md) ? " → " + usd(d.price * (1 + A.md)) : ""), "r") +
          tile(t("weighted"), pct(A.avg), t("weightedNote"), cls(A.avg)) + "</div>";
        var row = function (name, a) {
          var x = split(a);
          return "<tr><td>" + name + '</td><td class="n">' + x.n + '</td><td class="n ' + cls(x.avg) + '">' + pct(x.avg) + '</td><td class="n">' + pp(x.pu) + '</td><td class="n g">' + pct(x.mu) +
            '</td><td class="n">' + pp(x.pd) + '</td><td class="n r">' + pct(x.md) + "</td></tr>";
        };
        o += "<h3>" + t("scen") + '</h3><div class="tbl-wrap"><table><thead><tr><th></th><th class="n">' + t("count") + '</th><th class="n">' + t("avgReac") + '</th><th class="n">' + t("upProb") +
          '</th><th class="n">' + t("avgRise") + '</th><th class="n">' + t("downProb") + '</th><th class="n">' + t("avgDrop") + "</th></tr></thead><tbody>" +
          row(t("allRep"), all) + row(t("beat"), b) + row(t("miss"), m) + '</tbody></table></div><p class="sub">' + t("scenNote") + " " + t("oddsNote") + "</p>";
      }
      if (isNum(nx.eps_avg) || isNum(nx.rev_avg)) o += "<h3>" + t("consensus") + '</h3><div class="tbl-wrap"><table><thead><tr><th></th><th class="n">' + t("avg") + '</th><th class="n">' + t("low") + '</th><th class="n">' + t("high") + "</th></tr></thead><tbody>" +
        "<tr><td>" + t("eps") + '</td><td class="n">' + num(nx.eps_avg) + '</td><td class="n">' + num(nx.eps_lo) + '</td><td class="n">' + num(nx.eps_hi) + "</td></tr><tr><td>" + t("revenue") + '</td><td class="n">' + big(nx.rev_avg) + '</td><td class="n">' + big(nx.rev_lo) + '</td><td class="n">' + big(nx.rev_hi) + "</td></tr></tbody></table></div>";
    }
    h += sec("outlook", t("secOutlook"), o);

    /* 5 size */
    var si = sizeIdx(d.mc);
    h += sec("size", t("secSize"), '<div class="tiles">' + tile(t("cls"), sizeName(d.mc), big(d.mc)) + '</div><div class="chart" id="c-cap"></div>' +
      '<div class="tbl-wrap"><table><thead><tr><th>' + t("cls") + "</th><th>" + t("range") + "</th><th>" + t("traits") + "</th></tr></thead><tbody>" +
      t("sizeTable").map(function (r, i) { return "<tr" + (i === si ? ' style="font-weight:600"' : "") + "><td>" + esc(r[0]) + "</td><td>" + esc(r[1]) + '</td><td style="white-space:normal">' + esc(r[2]) + "</td></tr>"; }).join("") + "</tbody></table></div>");

    /* 6 fundamentals */
    var V = d.val || {}, Hh = d.health || {}, A = d.analyst || {};
    var dist = "";
    if (A.dist) { var mx = Math.max.apply(null, A.dist) || 1, cols = ["--gain", "--gain", "--axis", "--loss", "--loss"], op = [1, .55, 1, .55, 1];
      dist = '<div class="bars">' + A.dist.map(function (v, i) { return '<div class="row"><span>' + esc(t("dist")[i]) + '</span><span class="track"><span class="fill" style="display:block;width:' + (v / mx * 100) + "%;background:var(" + cols[i] + ");opacity:" + op[i] + '"></span></span><span class="num" style="text-align:right">' + v + "</span></div>"; }).join("") + "</div>"; }
    h += sec("fund", t("secFund"), '<div class="grid3"><div style="display:flex;flex-direction:column;gap:10px;min-width:0"><h3>' + t("valuation") + "</h3>" +
      kv([[t("pe"), num(V.pe, 1)], [t("fpe"), num(V.fpe, 1)], [t("peg"), num(V.peg)], [t("ps"), num(V.ps)], [t("pb"), num(V.pb)], [t("evEbitda"), num(V.ev_ebitda, 1)], [t("epsTTM"), num(V.eps)], [t("div"), isNum(V.div) ? V.div.toFixed(2) + "%" : "–"]]) +
      '</div><div style="display:flex;flex-direction:column;gap:10px;min-width:0"><h3>' + t("health") + "</h3>" +
      kv([[t("cash"), big(Hh.cash)], [t("debt"), big(Hh.debt)], [t("de"), num(Hh.de, 1)], [t("cr"), num(Hh.cr)], [t("short"), pct(Hh.short, 1, true)], [t("shortDays"), num(Hh.short_days, 1)], [t("inst"), pct(Hh.inst, 1, true)], [t("insider"), pct(Hh.insider, 1, true)]]) +
      '</div><div style="display:flex;flex-direction:column;gap:10px;min-width:0"><h3>' + t("analysts") + "</h3>" +
      tile(t("target"), usd(A.mean), isNum(A.mean) && isNum(d.price) ? pct(A.mean / d.price - 1) + " · " + t("targetRange") + " " + usd(A.lo) + " – " + usd(A.hi) : "", isNum(A.mean) ? cls(A.mean - d.price) : "") +
      '<p class="sub">' + (A.n ? A.n + (lang === "ko" ? t("analystsN") : " " + t("analystsN")) + " · " : "") + t("rating") + " " + esc(String(A.key || "–").replace("_", " ").toUpperCase()) + "</p>" + dist + "</div></div>");

    /* 7 news */
    h += sec("news", t("secNews"), d.news && d.news.length ? '<div class="news">' + d.news.map(function (n) {
      var when = new Date(n.d.replace("Z", ":00Z"));
      return '<a href="' + esc(n.u) + '" target="_blank" rel="noopener"><span class="t">' + esc(n.t) + '</span><span class="m">' + esc(n.s) + " · " + amsDateTime(when) + "</span></a>";
    }).join("") + "</div>" : '<p class="sub">' + t("noNews") + "</p>");

    /* 8 recent moves */
    var last16 = rows.slice(-16), vol63 = rows.slice(-63).reduce(function (a, r) { return a + r[5]; }, 0) / Math.min(63, rows.length);
    var rets = rows.slice(-253).map(function (r, i, a) { return i ? r[4] / a[i - 1][4] - 1 : null; }).filter(isNum);
    var sd = Math.sqrt(rets.reduce(function (a, v) { return a + v * v; }, 0) / rets.length);
    var recent = []; for (var i = last16.length - 1; i >= 1; i--) { var r0 = last16[i], c = r0[4] / last16[i - 1][4] - 1; recent.push([r0, c]); }
    var bigM = recent.filter(function (x) { return Math.abs(x[1]) > 2 * sd; });
    h += sec("recent", t("secRecent"), (d.intraday && d.intraday.length > 2 ? "<h3>" + t("intraday") + '</h3><div class="chart" id="c-intra"></div>' : "") +
      "<h3>" + t("last15") + '</h3><div class="tbl-wrap"><table><thead><tr><th>' + t("date") + '</th><th class="n">' + t("open") + '</th><th class="n">' + t("hi") + '</th><th class="n">' + t("lo") + '</th><th class="n">' + t("close") + '</th><th class="n">' + t("chg") + '</th><th class="n">' + t("volume") + '</th><th class="n">' + t("volRel") + "</th></tr></thead><tbody>" +
      recent.map(function (x) { var r = x[0], rel = r[5] / vol63; return "<tr><td>" + fmtDate(r[0], true) + '</td><td class="n">' + num(r[1]) + '</td><td class="n">' + num(r[2]) + '</td><td class="n">' + num(r[3]) + '</td><td class="n"><b>' + num(r[4]) + '</b></td><td class="n ' + cls(x[1]) + '">' + pct(x[1], 2) + '</td><td class="n">' + num(r[5], 0) + '</td><td class="n"' + (rel >= 1.5 ? ' style="font-weight:600"' : "") + ">" + rel.toFixed(2) + "×</td></tr>"; }).join("") +
      '</tbody></table></div><p class="sub"><b>' + t("bigMoves") + ":</b> " + (bigM.length ? bigM.map(function (x) { return fmtDate(x[0][0], false).replace(/, \d{4}/, "") + ' <span class="' + cls(x[1]) + '">' + pct(x[1]) + "</span>"; }).join(" · ") : t("none")) + "</p>");

    h += "</div>";
    $("#view").innerHTML = h;
    $("#view").querySelectorAll("[data-range]").forEach(function (b) { b.onclick = function () { S.range = +b.getAttribute("data-range"); $("#view").querySelectorAll("[data-range]").forEach(function (x) { x.setAttribute("aria-pressed", x === b); }); priceChart($("#c-price"), d); }; });
    drawCharts(d, histMove);
  }
  function drawCharts(d, histMove) {
    var el, ab = (d.reactions || []).map(function (r) { return Math.abs(r.day); }).filter(isNum);
    if (!isNum(histMove) && ab.length) histMove = ab.reduce(function (x, y) { return x + y; }, 0) / ab.length;
    if ((el = $("#c-q"))) groupBars(el, d.quarterly.filter(function (r) { return isNum(r[1]); }));
    if ((el = $("#c-price"))) priceChart(el, d);
    if ((el = $("#c-react"))) (function () {
      var rr = d.reactions.slice().reverse();
      barChart(el, rr.map(function (r) { return { x: r.date.slice(2, 7).replace("-", "."), v: r.day }; }), { label: t("reacDay"), labels: true,
        fmt: function (v) { return (v * 100).toFixed(Math.abs(v) < 0.1 ? 1 : 0) + "%"; },
        html: function (i) { return tipHtml(t("earnRep") + " · " + fmtLong(rr[i].date), reacRows(rr[i])); } });
    })();
    if ((el = $("#c-range"))) rangeChart(el, d.price, d.implied ? d.implied.move : histMove);
    if ((el = $("#c-cap"))) capScale(el, d.mc);
    if ((el = $("#c-intra"))) areaChart(el, d.intraday);
  }

  /* ---------- routing ---------- */
  function route() {
    var hsh = decodeURIComponent(location.hash.slice(1)), sym = hsh.split("/")[0].toUpperCase(), part = hsh.split("/")[1];
    S.sym = sym || null;
    render(part);
  }
  function render(part) {
    if (!S.cal) return;
    $("#updated").textContent = t("updated") + " " + amsDateTime(parseTs(S.cal.generated)) + " · " + t("ams");
    $("#back").hidden = !S.sym;
    $("#title").textContent = S.sym ? S.sym : "Earnings Desk";
    document.title = S.sym ? S.sym + " · Earnings Desk" : "Earnings Desk";
    if (!S.sym) { renderCalendar(); return; }
    var sym = S.sym, d = S.detail[sym];
    if (d) { renderDetail(d); if (part) { var tgt = document.getElementById(part); if (tgt) tgt.scrollIntoView(); } else if (typeof part === "string" || part === undefined) {} return; }
    if (S.cal.covered.indexOf(sym) < 0) { $("#view").innerHTML = '<div class="empty">' + esc(t("notFound")) + "</div>"; return; }
    $("#view").innerHTML = '<div class="empty">' + esc(t("loading")) + "</div>";
    get("t/" + sym + ".json").then(function (j) { S.detail[sym] = j; if (S.sym === sym) { render(part); if (!part) window.scrollTo(0, 0); } })
      .catch(function () { $("#view").innerHTML = '<div class="empty">' + esc(t("loadFail")) + "</div>"; });
  }
  window.addEventListener("hashchange", function () { var part = location.hash.split("/")[1]; route(); if (!part) window.scrollTo(0, 0); });
  var rt; window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(function () { if (S.sym && S.detail[S.sym]) drawCharts(S.detail[S.sym], null); }, 150); });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () { render(); });

  setLang(lang);
  get("calendar.json").then(function (j) { S.cal = j; route(); })
    .catch(function () { $("#updated").textContent = "–"; $("#view").innerHTML = '<div class="empty">' + esc(t("loadFail")) + "</div>"; });
})();
</script>
</body>
</html>
